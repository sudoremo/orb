<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orb — virtual list harness</title>
    <!--
      Drives the real frontend against a stubbed Tauri IPC, so the virtual list
      can be exercised in a browser with a folder far larger than any test
      mailbox. Each row's subject encodes its global index, which is what lets a
      test assert that the row drawn at a given scroll offset is the right one.

      Served by `pnpm dev` at /harness.html. Not part of the app bundle.
    -->
    <script>
      let TOTAL = Number(new URLSearchParams(location.search).get('total') || 198589);
      // ?empty=1: no task and no message in any inbox, for the empty views.
      const EMPTY = new URLSearchParams(location.search).get('empty') === '1';
      // A reading list in the Private account.
      const READING = new URLSearchParams(location.search).get('reading') === '1';
      // ?look=terminal: the Terminal look; ?theme=dark|light fixes the theme.
      // Tests set window.__mock.removed to simulate messages leaving the
      // folder, as an executed move or delete does.

      // The task fixture. `TODAY` is fixed rather than taken from the clock so
      // that a relative date the UI prints ("Tomorrow", "Thursday") is the same
      // string on every run — a test asserting on it must not start failing
      // because it is now Wednesday.
      const TODAY = "2026-08-07";
      // ?spread=1: the mail dated an hour apart, newest at 12:30 UTC on
      // TODAY, so that Today mixed has threads and reading to place among it.
      const SPREAD = new URLSearchParams(location.search).has("spread");
      // What was moved out of an inbox or the reading list, spread out.
      const gone = new Set();
      const mailDate = (i) =>
        SPREAD ? new Date(Date.UTC(2026, 7, 7, 12, 30) - i * 3_600_000).toISOString().replace(".000Z", "Z") : "2026-01-01T00:00:00Z";

      // The highlight rules of the harness, exercising every style option.
      const HIGHLIGHT_STYLES = [
        { name: "Boss", style: { color: "#e6b422", background: null, icon: "fa-crown",
            icon_color: null, label: null, label_color: null, bold: true, italic: false,
            dim: false, sidebar_badge: true } },
        { name: "Invoices", style: { color: null, background: "rgba(76, 141, 255, 0.10)",
            icon: null, icon_color: null, label: "invoice", label_color: "#4c8dff",
            bold: false, italic: true, dim: false, sidebar_badge: false } },
        { name: "Newsletters", style: { color: null, background: null, icon: null,
            icon_color: null, label: null, label_color: null, bold: false, italic: false,
            dim: true, sidebar_badge: false } },
        { name: "Urgent", style: { color: "var(--danger)", background: null,
            icon: "fa-triangle-exclamation", icon_color: "var(--warning)", label: "urgent",
            label_color: "var(--danger)", bold: false, italic: false, dim: false,
            sidebar_badge: false } },
        { name: "Nonsense", style: { color: null, background: null, icon: "fa-no-such-icon",
            icon_color: null, label: "a label long enough to be cut short", label_color: null,
            bold: false, italic: false, dim: false, sidebar_badge: false } },
      ];
      // Which rules a message matches: the first rows show every combination.
      // A subject rewriting rule's icons on every tenth message: one of them a
      // name Font Awesome does not have, which must be left out, and one a
      // brand icon, which only the brands font has.
      const subjectIconsOf = (i) =>
        i % 10 === 2
          ? [{ icon: "fa-gears", color: "#d33" }, { icon: "fa-no-such-icon", color: null }, { icon: "fa-linux", color: null }]
          : [];
      const highlightsOf = (i) => {
        const names = [];
        if (i % 7 === 1) names.push("Boss");
        if (i % 5 === 2) names.push("Invoices");
        if (i % 9 === 3) names.push("Newsletters");
        if (i % 11 === 4) names.push("Urgent");
        if (i === 5) names.push("Boss", "Invoices", "Urgent", "Nonsense");
        if (i === 6) names.push("Nonsense");
        return names;
      };
      let nextTaskId = 100;
      // The tag registry, and task 1 tagged with one of them.
      const TAGS = [
        { id: "tag-work", name: "work", colour: null, position: 1, is_known: true },
        { id: "tag-home", name: "home", colour: null, position: 2, is_known: true },
      ];
      const TASK_TAGS = { 1: [TAGS[0]] };
      // ?moretags=1: two tags one of which is the other's initials, and task 2 tagged twice.
      if (new URLSearchParams(location.search).has("moretags")) {
        TAGS.push(
          { id: "tag-seedlings", name: "Garden Seedling Inventory", colour: null, position: 3, is_known: true },
          { id: "tag-gsi", name: "GSI", colour: null, position: 4, is_known: true },
        );
        TASK_TAGS[2] = [TAGS[1], TAGS[3]];
      }
      // Task 1's checklist, one step of three done.
      const TASK_STEPS = {
        1: [
          { id: "s1", title: "Write the list", done: true },
          { id: "s2", title: "Check the fridge", done: false },
          { id: "s3", title: "Go to the shop", done: false },
        ],
      };
      // Task 1 links a message that was answered from Sent and one that was not.
      const LINKS = {
        1: [
          { message_id: "<asked@example.com>", subject: "Groceries for Saturday?", from: "Sara",
            date: "2026-08-06T10:00:00Z", account_name: "Work", folder_name: "INBOX",
            answered: true, replied_at: "2026-08-06T12:45:00Z" },
          { message_id: "<list@example.com>", subject: "The list", from: "Lukas",
            date: "2026-08-07T08:00:00Z", account_name: "Work", folder_name: "INBOX",
            answered: false, replied_at: null },
        ],
      };
      const TASKS = [
        // Scheduled for today and due today: the ordinary Today row.
        { id: 1, title: "Buy groceries", postpone_date: TODAY, due_date: TODAY,
          body: null, completed_at: null, deleted_at: null },
        // Scheduled for today, no due date. In Today this row has nothing to
        // say in its date column, which is the case the per-view rule is about.
        { id: 2, title: "Call the plumber", postpone_date: TODAY, due_date: null,
          body: "https://plumber.example.com/book\nRing before six.\nQuote: message://%3cquote@plumber.example.com%3e", completed_at: null, deleted_at: null },
        // Both dates, both in the future: the Upcoming row that has to show two.
        { id: 3, title: "Renew the passport", postpone_date: "2026-08-20",
          due_date: "2026-08-24", body: null, completed_at: null, deleted_at: null },
        // Due only, in the future.
        { id: 4, title: "Book the flights", postpone_date: null, due_date: "2026-08-13",
          body: null, completed_at: null, deleted_at: null },
        // Undated: Someday.
        { id: 5, title: "Learn the piano", postpone_date: null, due_date: null,
          body: null, completed_at: null, deleted_at: null },
        // Due last week: overdue, and so in Today.
        { id: 6, title: "Renew the domain", postpone_date: null, due_date: "2026-08-01",
          body: null, completed_at: null, deleted_at: null },
        // Completed long ago: archived, so in Archived and not in Completed.
        { id: 7, title: "File the taxes", postpone_date: null, due_date: null, body: null,
          completed_at: "2026-03-01T10:00:00Z", deleted_at: null, archived: true },
      ];
      // ?longnotes=1: task 1's notes long enough for its detail to scroll.
      if (new URLSearchParams(location.search).has("longnotes")) {
        TASKS[0].body = Array.from({ length: 80 }, (_, i) => `Line ${i + 1} of the notes`).join("\n");
      }
      // ?manytasks=N: N more tasks in Today, enough to scroll.
      for (let i = 0; i < Number(new URLSearchParams(location.search).get("manytasks") ?? 0); i++) {
        TASKS.push({ id: 1000 + i, title: `Errand ${i}`, postpone_date: TODAY, due_date: null,
          body: null, completed_at: null, deleted_at: null });
      }
      // ?repeat=1: a repeating task completed today, open again for tomorrow.
      if (new URLSearchParams(location.search).has("repeat")) {
        TASKS.push({ id: 8, title: "Water the plants", postpone_date: null, due_date: "2026-08-08",
          body: null, completed_at: null, deleted_at: null, recurring: true, done_today: true });
      }
      if (EMPTY) TASKS.length = 0;

      // Mirrors `TaskView::includes` — Upcoming holds every open dated task,
      // Today those dated at most today, Someday the undated.
      // A task completed here is in Today, struck through, until a
      // clear-completed after it (§10.2); `since` is that clear.
      const inView = (task, view, since = null) => {
        if (task.deleted_at) return view === "trash";
        if (view === "trash") return false;
        if (view === "archive") return !!task.archived;
        if (view === "completed") return !!task.completed_at && !task.archived;
        const dated = task.postpone_date || task.due_date;
        const today =
          (task.postpone_date && task.postpone_date <= TODAY) ||
          (task.due_date && task.due_date <= TODAY);
        if (view === "today") {
          if (task.done_today) return !since;
          if (task.completed_at) return !!task.completed_here && (!since || task.completed_at > since);
          return !!today;
        }
        if (view === "upcoming") return !task.completed_at && !!dated;
        return !task.completed_at && !dated;
      };

      const summary = (task) => ({
        id: task.id,
        uuid: `uuid-${task.id}`,
        title: task.title,
        postpone_date: task.postpone_date,
        due_date: task.due_date,
        completed_at: task.completed_at,
        deleted_at: task.deleted_at,
        tags: TASK_TAGS[task.id] ?? [],
        is_recurring: !!task.recurring,
        position: task.id,
        is_working_on: !!task.working,
        is_completed: !!task.completed_at,
        is_overdue: !!task.due_date && task.due_date < TODAY && !task.completed_at,
        is_dirty: !!task.dirty,
        linked_email_count: (LINKS[task.id] ?? []).length,
        steps_total: (TASK_STEPS[task.id] ?? []).length,
        steps_done: (TASK_STEPS[task.id] ?? []).filter((s) => s.done).length,
        reminder_count: 0,
        attachment_count: 0,
      });

      const detail = (task) => ({
        task: summary(task),
        body: task.body,
        recurrence: null,
        recurrence_from_completion: false,
        created_at: "2026-08-07T09:00:00Z",
        updated_at: "2026-08-07T09:00:00Z",
        revision: 1,
        account_name: "Work",
        reminders: [],
        links: LINKS[task.id] ?? [],
        steps: TASK_STEPS[task.id] ?? [],
        attachments: [],
        // Two entries, so the timeline's markers are actually drawn and their
        // geometry can be measured.
        log: [
          { entry_uuid: `log-${task.id}-1`, occurred_at: "2026-08-07T09:00:00Z",
            occurred_at_unix: 1786000000, device_id: null, event_type: "created",
            text: `Created '${task.title}'` },
          { entry_uuid: `log-${task.id}-2`, occurred_at: "2026-08-07T09:05:00Z",
            occurred_at_unix: 1786000300, device_id: null, event_type: "edited",
            text: "Postpone date set to 2026-08-07" },
        ],
      });

      // The `clear_*` flags carry "set this to nothing", which JSON cannot tell
      // from "leave alone" — the same contract the real `TaskEdit` has.
      const applyEdit = (task, edit) => {
        if (!task || !edit) return;
        if (edit.title !== undefined) task.title = edit.title;
        if (edit.clear_body) task.body = null;
        else if (edit.body !== undefined) task.body = edit.body;
        if (edit.clear_postpone_date) task.postpone_date = null;
        else if (edit.postpone_date !== undefined) task.postpone_date = edit.postpone_date;
        if (edit.clear_due_date) task.due_date = null;
        else if (edit.due_date !== undefined) task.due_date = edit.due_date;
        if (edit.is_working_on !== undefined) task.working = edit.is_working_on;
      };

      // ?chat=1: a chat server with threads waiting (PLAN.md, Phase 15);
      // ?chat=signedout: one that has not been signed in to; ?chat=quiet: one
      // where nothing waits.
      // ?outbox=1: one message the server refused and one waiting for it.
      window.__outbox = new URLSearchParams(location.search).get("outbox") === "1"
        ? [
            { id: 7, account: "Work", sending_as: "Work (Support)", from: "Me <it@example.org>",
              to: ["boss@example.com"], cc: [], bcc: [], subject: "Quarterly report",
              body: "Here it is.", attachments: ["report.pdf"], queued_at: "2026-10-28T10:29:36Z",
              attempts: 1, error: "535 Incorrect authentication data", failed_at: "2026-10-28T10:29:36Z" },
            { id: 8, account: "Work", sending_as: "Work", from: "me@example.com",
              to: ["team@example.com"], cc: [], bcc: [], subject: "Lunch?",
              body: "At noon.", attachments: [], queued_at: "2026-10-28T11:00:00Z",
              attempts: 2, error: "connection refused", failed_at: null },
          ]
        : [];
      const CHAT = new URLSearchParams(location.search).get("chat");
      const at = (h, m) => Date.UTC(2026, 7, 7, h - 2, m);
      const room = (rid, kind, name, label) => ({ rid, kind, name, fname: name, label, unread: 0, mentions: 0 });
      const ORB_DEV = room("r-dev", "c", "orb-dev", "#orb-dev");
      const LUKAS = room("r-lukas", "d", "lukas", "Direct");
      const SUPPORT = room("r-sup", "c", "support", "#support");
      const CHAT_ROWS = [
        { rid: "r-lukas", thread: "", room: LUKAS, title: null, replies: 0, author: "Lukas Meier",
          preview: "Can you have a quick look at the PR? The sync test is red again.", newest_at: at(12, 41),
          waiting_since: at(12, 41), mention: false, unread: true, files: false, task: false },
        { rid: "r-dev", thread: "t-rel", room: ORB_DEV, title: "Release 0.9 — what is still missing?", replies: 3,
          author: "Sara Brunner", preview: "@sam the notarisation step fails on CI, see the log", newest_at: at(12, 20),
          waiting_since: at(12, 5), mention: true, unread: true, files: true, task: false },
        { rid: "r-sup", thread: "t-login", room: SUPPORT, title: "Customer cannot sign in after the update", replies: 4,
          author: "Daniel Rossi", preview: "They are on Safari 17, does that ring a bell?", newest_at: at(11, 5),
          waiting_since: at(11, 5), mention: false, unread: false, files: false, task: true },
      ];
      for (const row of CHAT_ROWS) Object.assign(row, { waits: true, mine_last: false });
      // A thread of #orb-dev answered already: in the room's list, not in Waiting.
      const ANSWERED = { rid: "r-dev", thread: "t-flaky", room: ORB_DEV, title: "Flaky store_integration test on CI", replies: 6,
        author: "Sam Taylor", preview: "Fixed in 3f2a1c0.", newest_at: at(11, 58), waiting_since: at(11, 58),
        mention: false, unread: false, files: false, task: false, waits: false, mine_last: true };
      LUKAS.presence = "away";
      const CHAT_ROOMS = [LUKAS, ORB_DEV, SUPPORT, room("r-gen", "c", "general", "#general")];
      const message = (id, rid, tmid, who, h, m, body, extra = {}) => ({
        id, rid, tmid, author_id: who === "Sam Taylor" ? "me" : who, author_username: who.split(" ")[0].toLowerCase(),
        author_name: who, mine: who === "Sam Taylor", body, ts: at(h, m), edited: false, system: null, replies: 0,
        mentions_me: false, files: [], reactions: [], quotes: [], tasks: [], ...extra,
      });
      const CHAT_MESSAGES = {
        "r-lukas\u0000": [message("m1", "r-lukas", null, "Lukas Meier", 12, 41, "Can you have a quick look at the PR? The sync test is red again.")],
        "r-dev\u0000t-rel": [
          message("t-rel", "r-dev", null, "Lukas Meier", 9, 12, "Release 0.9 — what is still missing?", { replies: 3 }),
          message("m2", "r-dev", "t-rel", "Sam Taylor", 11, 2, "README is done, the migration notice is in review."),
          message("m3", "r-dev", "t-rel", "Sara Brunner", 12, 18, "@sam the notarisation step fails on CI, see the log and #4711, not https://ci.example.com/runs/#4712 or `#4713`. Maybe #4714.2.",
            { mentions_me: true, files: [{ name: "ci-notarize.log", size: 18000 }] }),
          message("m4", "r-dev", "t-rel", "Sara Brunner", 12, 20, "Probably the *expired* certificate again? `codesign` says so.",
            { reactions: [{ emoji: ":eyes:", count: 1, mine: false }],
              // A tall screenshot with its preview, and one whose preview the server cannot give.
              files: [
                { name: "codesign.png", mime: "image/png", size: 28081, path: "/file-upload/A/codesign.png",
                  preview: "/file-upload/B/thumb-codesign.png", width: 572, height: 750 },
                { name: "cert.png", mime: "image/png", size: 9000, path: "/file-upload/C/cert.png",
                  preview: "/file-upload/D/thumb-cert.png", width: 400, height: 100 },
              ],
              quotes: [{ author: "Sam Taylor", text: "README is done, the migration notice is in review.",
                link: "https://chat.example.com/group/orb-dev?msg=m2" }] }),
        ],
        "r-sup\u0000t-login": [
          message("t-login", "r-sup", null, "Daniel Rossi", 10, 40, "Customer cannot sign in after the update", { replies: 1 }),
          message("m5", "r-sup", "t-login", "Daniel Rossi", 11, 5, "They are on Safari 17, does that ring a bell?"),
        ],
      };
      // The support thread is long enough to scroll, and Lukas's messages
      // reach further back than the first page.
      for (let i = 0; i < 40; i++) {
        CHAT_MESSAGES["r-sup\u0000t-login"].splice(1, 0, message(`filler-${i}`, "r-sup", "t-login", "Daniel Rossi", 10, 41, `Earlier note ${i}`));
      }
      const CHAT_OLDER = {
        "r-lukas\u0000": [
          message("old-1", "r-lukas", null, "Lukas Meier", 8, 1, "Morning — the build from last night is green."),
          message("old-2", "r-lukas", null, "Sam Taylor", 8, 3, "Thanks, I will look after lunch."),
        ],
      };
      const CHAT_DONE = new Map();
      // The muted rooms, by id: when the mute ends, or null for one the user ends.
      const CHAT_MUTED = new Map();
      const applyMutes = () => {
        for (const r of CHAT_ROOMS) {
          const ends = CHAT_MUTED.get(r.rid);
          r.muted = CHAT_MUTED.has(r.rid) && (ends === null || ends > Date.now());
          r.muted_until = r.muted ? ends : null;
        }
        for (const row of [...CHAT_ROWS, ANSWERED]) row.muted = !!row.room.muted && !row.mention;
      };
      // The core's undo history, as far as the tests need it: each action
      // keeps the calls that take it back, made through `invoke` like any
      // other so a test sees them.
      const HISTORY = { undo: [], redo: [] };
      const remember = (label, back) => {
        HISTORY.undo.push({ label, back });
        HISTORY.redo = [];
      };

      // ?window=tasks: the window that shows tasks only; ?window=message-<id>
      // and ?window=task-<id>, the window of one message or task.
      const LABEL =new URLSearchParams(location.search).get("window") ?? "main";
      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: LABEL },
          currentWebview: { windowLabel: LABEL, label: LABEL },
        },
        transformCallback: (cb) => {
          const id = "cb_" + Math.random().toString(36).slice(2);
          window[id] = cb;
          return id;
        },
        convertFileSrc: (p) => p,

        invoke: async (cmd, args) => {
          window.__calls = window.__calls || [];
          window.__calls.push({ cmd, args });

          // Remember which callback belongs to which event, so a test can push
          // progress through the real listener rather than faking the display.
          if (cmd === "plugin:event|listen") {
            (window.__listeners = window.__listeners || {})[args.event] = args.handler;
            return 0;
          }
          // Tests can slow a command down or make it fail, to observe the
          // unconfirmed state and the revert path.
          const mock = (window.__mock = window.__mock || { delay: {}, fail: [] });
          // ?failsync=1 makes the startup sync fail, to check that what comes
          // after it still runs.
          if (new URLSearchParams(location.search).get('failsync') && !mock.fail.includes('sync_all')) {
            mock.fail.push('sync_all');
          }
          // Every call, in the order made, for the tests that check what an
          // action was sent to act on.
          (mock.calls = mock.calls ?? []).push([cmd, args]);
          await new Promise((r) => setTimeout(r, mock.delay[cmd] ?? 8));
          if (mock.fail.includes(cmd)) throw `mock failure: ${cmd}`;
          // Answered commands, for a test that has to wait out the redraw
          // the startup sync ends in. Recorded a little after the answer,
          // once what it set off has been drawn.
          setTimeout(() => (mock.answered = mock.answered ?? []).push(cmd), 50);

          // The actions whose undo the tests only need to see recorded.
          if (args?.undo && ["stage_action", "unstage_action", "move_messages", "delete_messages", "copy_messages",
              "transfer_messages", "execute_pending", "execute_pending_all", "discard_pending", "run_filters",
              "run_filters_all"].includes(cmd)) {
            remember(args.undo, []);
          }

          switch (cmd) {
            case "bindings":
              return {
                index_normal: {
                  j: "next-message",
                  k: "prev-message",
                  gg: "top",
                  G: "bottom",
                  "<C-d>": "next-page",
                  "<C-u>": "prev-page",
                  "<enter>": "open-message-detail",
                  ":": "command-mode",
                  "<space>": "select-message",
                  "B": "fetch-bodies",
                  "!": "toggle-flag",
                  d: "mark-delete",
                  u: "unmark && next-message",
                  x: "expunge",
                  A: "stage-read && mark-move Archive && next-message",
                  y: "create-task-from-message && stage-read && mark-move Archive && next-message",
                  Y: "create-task-from-message postpone && stage-read && mark-move Archive && next-message",
                  Z: "mark-delete && advance",
                  "/": "search-mode",
                  // ?bind=g2:open-pinned%202 — more bindings, as the config adds them.
                  ...Object.fromEntries((new URLSearchParams(location.search).get("bind") ?? "")
                    .split(",").filter(Boolean).map((b) => [b.slice(0, b.indexOf(":")), b.slice(b.indexOf(":") + 1)])),
                },
                index_detail: null,
                // ?own=1 — a command of one's own, as bindings.commands names one.
                commands: new URLSearchParams(location.search).has("own")
                  ? { "file-and-next": { run: "stage-read && mark-move Archive && next-message", title: "File and Move On" },
                      "file-twice": { run: "file-and-next && file-and-next", title: null },
                      loop: { run: "loop", title: null } }
                  : null,
              };

            case "accounts":
              return [{ name: "Work", email: "me@example.com", drafts_folder: "Drafts",
                        trash_folder: "Trash", archive_folder: "Archive", junk_folder: "Junk" }];
            case "pending_counts":
            case "pending_actions":
            case "account_statuses":
              return [];
            case "outbox":
              return structuredClone(window.__outbox);
            case "retry_outbox": {
              const queued = window.__outbox.find((q) => q.id === args.id);
              if (queued) queued.failed_at = null;
              return null;
            }
            case "discard_outbox":
              window.__outbox = window.__outbox.filter((q) => q.id !== args.id);
              return null;
            case "edit_outbox": {
              const q = window.__outbox.find((x) => x.id === args.id);
              return { account: q.account, draft: { to: q.to, cc: q.cc, bcc: q.bcc, subject: q.subject,
                body: q.body, in_reply_to: null, references: null, forwards: null,
                attachments: [], identity: "" } };
            }
            // Message 6 carries a file that is dangerous to open, and one that is not.
            case "attachments":
              return args.id === 6
                ? [{ filename: "invoice.html", content_type: "text/html", size: 2048, part_id: "1",
                     is_inline: false, content_id: null,

            case "move_task": {

              // a large subject backlog actually does on every early pass.
              // Never-ending work, for testing what happens *while* a long
              // background job runs rather than how it ends.
              if (mock.endlessBodies) {
                mock.step = (mock.step ?? 0) + 1;
                return { shaped: 0, unshaped: 0, fetched: 10, missing: 0, unreadable: 0, embedded: 0, embeddings_pending: 0,
                         html: 0, sources: 0, sources_pending: 0, threaded: 0, threads_pending: 0, pending: 9999, total: 99999, messages: 99999 };
              }
              // Two folders of 200. Each is shaped then bodied before the next
              // is touched, so the second folder's shaping follows the first
              // folder's bodies.
              mock.step = (mock.step ?? 0) + 1;
              const steps = [
                { shaped: 200, unshaped: 200, fetched: 0,   pending: 400, total: 200 },
                { shaped: 0,   unshaped: 200, fetched: 200, pending: 200, total: 200 },
                { shaped: 200, unshaped: 0,   fetched: 0,   pending: 200, total: 400 },
                { shaped: 0,   unshaped: 0,   fetched: 200, pending: 0,   total: 400 },
              ];
              const st = steps[Math.min(mock.step - 1, steps.length - 1)];
              return { ...st, messages: 400, missing: 0, unreadable: 0, html: 0, sources: 0, sources_pending: 0, threaded: 0, threads_pending: 0 };
            }

            case "body_backfill_progress":
              return { shaped: 0, unshaped: 400, messages: 400, fetched: 0, missing: 0,
                       unreadable: 0, embedded: 0, embeddings_pending: 0,
                       html: 0, sources: 0, sources_pending: 0, threaded: 0, threads_pending: 0, pending: 400, total: 400 };

            // Every UID in the folder, in one query — what a whole-folder
            // selection asks for instead of paging the rows.
            case "folder_uids":
              return Array.from({ length: TOTAL }, (_, i) => i + 1);

            case "execute_pending":
            case "execute_pending_all":
              return { executed: mock.removed ?? 0, warnings: [] };

            case "sync_folder":
            case "sync_all":
              return {
                folders_synced: cmd === "sync_all" ? 4 : 1,
                messages_added: 3,
                messages_updated: 1,
                messages_deleted: 0,
                errors: [],
              };

            case "open_compose":
              // The real thing opens a window; here it is enough to record it.
              return null;

            case "save_draft":
              mock.draftSaves = (mock.draftSaves ?? 0) + 1;
              return 4242;

            case "discard_draft":
              return null;

            case "edit_in_nvim":
              return { saved: mock.saved ?? false, text: args.text };

            case "run_filters":
            case "run_filters_all":
              return { filtered: 0, warnings: [] };

            default:
              return null;
          }
        },
      };

      // Push an event through the real listener, as the core does.
      window.__emit = (event, payload) => {
        const id = (window.__listeners || {})[event];
        if (id && window[id]) window[id]({ event, id: 0, payload });
      };
    </script>
  </head>
  <body>
    <div id="search-overlay" hidden>
      <div id="search-panel">
      <div id="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span id="search-chips"></span>
        <input
          id="search-input"
          type="search"
          spellcheck="false"
          autocomplete="off"
          placeholder="Search mail"
        />
        <span id="search-kind" class="seg" role="radiogroup" aria-label="Search for"></span>
        <button id="search-clear" type="button" title="Clear search" hidden>
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="search-scope"></div>
      <div id="search-suggest"></div>
      <div id="search-ops"></div>
      </div>
    </div>
    <div id="app">
      <div id="sidebar-top" data-tauri-drag-region></div>
      <button id="sidebar-toggle" type="button"></button>
      <header id="toolbar" data-tauri-drag-region></header>
      <aside id="folders" class="pane" role="listbox" aria-label="Folders"></aside>
      <div id="vsplit" class="split"></div>
      <section id="list" class="pane" role="group" aria-label="List"></section>
      <div id="hsplit" class="split"></div>
      <article id="reader" class="pane"></article>
    </div>
    <footer id="statusbar">
      <span id="status-mode" class="mode" aria-hidden="true"></span>
      <span id="status" role="status" aria-live="polite"></span>
      <span id="status-steady"></span>
      <button id="tasks-toggle" type="button" hidden></button>
    </footer>
    <div id="tasks-panel" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
