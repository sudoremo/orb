<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb — Main Window Concepts</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #e9eaee;
    min-height: 100vh;
    background:
      radial-gradient(55vw 40vw at 5% 0%, #31407e 0, transparent 65%),
      radial-gradient(45vw 35vw at 100% 25%, #6a2a4e 0, transparent 62%),
      radial-gradient(60vw 45vw at 50% 110%, #0f5c4d 0, transparent 60%),
      #0b0c14;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  body.page-light {
    color: #1d1e22;
    background:
      radial-gradient(55vw 40vw at 5% 0%, #c3cff8 0, transparent 65%),
      radial-gradient(45vw 35vw at 100% 25%, #f6cddd 0, transparent 62%),
      radial-gradient(60vw 45vw at 50% 110%, #bfeadb 0, transparent 60%),
      #eef0f6;
    background-attachment: fixed;
  }

  /* ---------- Page controls ---------- */
  .ctl {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    width: 1280px; margin: 0 auto; padding: 26px 0 18px;
  }
  .ctl h1 { font-size: 15px; font-weight: 600; margin: 0 auto 0 0; letter-spacing: -.01em; }
  .ctl h1 span { opacity: .55; font-weight: 400; }
  .seg { display: inline-flex; padding: 2px; border-radius: 8px; background: rgba(255,255,255,.08); }
  .page-light .seg { background: rgba(0,0,0,.06); }
  .seg button {
    font: inherit; font-size: 12px; color: inherit; border: 0; background: none;
    padding: 4px 11px; border-radius: 6px; cursor: pointer; opacity: .7;
  }
  .seg button.on { background: rgba(255,255,255,.18); opacity: 1; }
  .page-light .seg button.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .seg button { white-space: nowrap; }
  /* The states, two levels deep: the area of the app, then the states of it. */
  .states { flex-basis: 100%; display: flex; align-items: center; gap: 10px; }
  .states .sep { opacity: .35; }
  .ctl .keys { font: 11px ui-monospace, "SF Mono", Menlo, monospace; opacity: .5; }

  .stage { width: 1280px; margin: 0 auto; }
  .notes {
    width: 1280px; margin: 26px auto 60px; display: grid;
    grid-template-columns: 1fr 1fr; gap: 28px; font-size: 13px;
  }
  .notes h3 { font-size: 12px; font-weight: 600; margin: 0 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .05em; }
  .notes h3 + ul + h3 { margin-top: 18px; }
  .notes ul { margin: 0; padding-left: 18px; }
  .notes li { margin: 0 0 5px; opacity: .85; }

  .guide {
    width: 1280px; margin: -30px auto 70px; padding: 26px 30px; border-radius: 12px;
    background: var(--pane); color: var(--fg); display: grid; grid-template-columns: 1fr 1.1fr; gap: 40px;
    box-shadow: 0 0 0 1px var(--frame), 0 20px 50px rgba(0,0,0,.25);
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  .guide h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; }
  .guide ol { margin: 0; padding-left: 18px; color: var(--fg2); }
  .guide li { margin-bottom: 7px; }
  .guide li b { color: var(--fg); font-weight: 600; }
  .gset { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .gi { display: grid; justify-items: center; gap: 8px; padding: 12px 4px 10px; border-radius: 8px; background: var(--chip); }
  .gi .big { width: 30px; height: 30px; color: var(--fg2); stroke-width: 1.5; }
  .gi .row1 { display: flex; gap: 12px; align-items: center; }
  .gi .ic:not(.big) { width: 16px; height: 16px; color: var(--fg3); }
  .gi .sm { width: 13px !important; height: 13px !important; }
  .guide .gi .sm .duo { stroke: currentColor; }
  .gi span { font: 10.5px var(--mono); color: var(--fg3); }
  .gi.warm .ic { --duo: var(--warn); }
  .gmono { margin-top: 14px; color: var(--fg3); font-size: 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .gmono .ic { width: 15px; height: 15px; }

  /* ---------- Window and tokens ---------- */
  .win {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
    --row-pad-l: 10px; --row-pad-r: 16px; --status-w: 18px; --col-gap: 10px; --chk-w: 16px; --item-px: 10px;
    /* Where list text starts. The reader and the detail pane start there too. */
    --text-x: calc(var(--row-pad-l) + var(--status-w) + var(--col-gap));
    position: relative; width: 1280px; height: 800px; border-radius: 12px; overflow: hidden;
    display: grid; grid-template-columns: var(--sb-w) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
    font-family: var(--font); font-size: 13px; color: var(--fg);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 .5px rgba(0,0,0,.6);
  }
  .win::after {
    content: ""; position: absolute; inset: 0; border-radius: 12px; pointer-events: none;
    box-shadow: inset 0 0 0 1px var(--frame);
  }
  .win.dark, .guide.dark {
    --sb-bg: rgba(34, 35, 42, .64);
    --pane: #1c1d21;
    --line: rgba(255,255,255,.075);
    --frame: rgba(255,255,255,.1);
    --fg: #e7e8eb;
    --fg2: #a2a5ad;
    --fg3: #888b93;
    --accent: #6f8cff;
    --accent-fg: #fff;
    --accent-soft: rgba(111,140,255,.15);
    --cursor-bg: rgba(255,255,255,.1);
    --cursor-fill: #4060c0;
    --hover: rgba(255,255,255,.035);
    --sb-active: rgba(255,255,255,.1);
    --chip: rgba(255,255,255,.07);
    --menu-bg: rgba(44, 45, 52, .86);
    --warn: #e7b04c;
    --danger: #f0726b;
    --ok: #5ec48c;
    --kbd: rgba(255,255,255,.08);
    color-scheme: dark;
  }
  .win.light, .guide.light {
    --sb-bg: rgba(236, 237, 242, .7);
    --pane: #ffffff;
    --line: rgba(0,0,0,.075);
    --frame: rgba(0,0,0,.12);
    --fg: #1c1d21;
    --fg2: #5c5f68;
    --fg3: #6f727a;
    --accent: #3b64f1;
    --accent-fg: #fff;
    --accent-soft: rgba(59,100,241,.1);
    --cursor-bg: rgba(0,0,0,.12);
    --cursor-fill: #335ce1;
    --hover: rgba(0,0,0,.04);
    --sb-active: rgba(0,0,0,.075);
    --chip: rgba(0,0,0,.05);
    --menu-bg: rgba(246, 246, 249, .9);
    --warn: #976410;
    --danger: #d23c35;
    --ok: #1b7a45;
    --kbd: rgba(0,0,0,.06);
    color-scheme: light;
  }

  .sb {
    position: relative; background: var(--sb-bg);
    -webkit-backdrop-filter: blur(40px) saturate(1.7); backdrop-filter: blur(40px) saturate(1.7);
    border-right: 1px solid var(--line); padding: var(--sb-top) 10px 12px; overflow: hidden;
  }
  .lights { position: absolute; top: 14px; left: 16px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
  .lights i:nth-child(1) { background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }
  /* Shows and hides the sidebar (`zs`), beside the lights. */
  .sbt { position: absolute; top: 7px; left: 80px; width: 26px; height: 26px; display: inline-flex;
    align-items: center; justify-content: center; border: 0; border-radius: 6px; background: none;
    color: var(--fg3); padding: 0; }
  .sbt:hover { background: var(--chip); color: var(--fg); }

  .main { position: relative; background: var(--pane); display: grid; grid-template-rows: var(--tb-h) minmax(0, 1fr) var(--st-h); min-width: 0; }
  .tb { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); min-width: 0; }
  .tb-t { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  .tb-s { color: var(--fg3); white-space: nowrap; }
  .tb-sp { flex: 1; }
  .sort { position: relative; }
  .sortbtn {
    font: inherit; font-size: 12px; color: var(--fg2); background: none; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border-radius: 6px;
  }
  .sortbtn:hover, .sort.open .sortbtn { background: var(--chip); color: var(--fg); }
  .sortbtn .ic { width: 13px; height: 13px; color: var(--fg3); }
  .sortbtn .chev { width: 11px; height: 11px; }
  .menu {
    position: absolute; top: 31px; right: 0; z-index: 10; width: 228px; padding: 5px;
    border-radius: 9px; background: var(--menu-bg); color: var(--fg); font-size: 13px;
    -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
    box-shadow: 0 12px 34px rgba(0,0,0,.32), 0 0 0 .5px var(--frame), inset 0 .5px 0 rgba(255,255,255,.08);
  }
  .menu .mh { padding: 5px 9px 3px; font-size: 11px; font-weight: 600; color: var(--fg3); }
  .menu .mi { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 9px; border-radius: 5px; cursor: default; white-space: nowrap; }
  .menu .mi:hover { background: var(--accent); color: var(--accent-fg); }
  .menu .mi:hover * { color: inherit !important; }
  .menu .mi .ck { width: 12px; color: var(--fg); }
  .menu .mi kbd { margin-left: auto; }
  .menu hr { border: 0; height: 1px; background: var(--line); margin: 5px 8px; }
  .search {
    display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 8px 0 9px;
    width: 220px; border-radius: 7px; background: var(--chip); color: var(--fg3);
  }
  .search .ic { width: 13px; height: 13px; }
  .search .q { flex: 1; }
  .search.on { color: var(--fg); background: var(--pane); box-shadow: inset 0 0 0 1.5px var(--accent); }
  kbd {
    text-transform: none; letter-spacing: 0;
    font: 10.5px/1 var(--mono); color: var(--fg2); background: var(--kbd);
    border-radius: 4px; padding: 3px 5px; min-width: 16px; text-align: center; display: inline-block;
  }

  .panes { display: grid; min-height: 0; }
  .panes.v { grid-template-rows: var(--list-h) minmax(0, 1fr); }
  .panes.h { grid-template-columns: 440px minmax(0, 1fr); }
  .panes.one { grid-template-rows: minmax(0, 1fr); }
  .list, .reader { position: relative; overflow: hidden; min-width: 0; }
  .list { padding: 4px 0; }
  .panes.v .list { border-bottom: 1px solid var(--line); }
  .panes.h .list { border-right: 1px solid var(--line); }
  /* A pane with more below says so, rather than ending on a row boundary. */
  .more::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; pointer-events: none;
    background: linear-gradient(transparent, var(--pane));
  }
  /* Maximized: the title strip keeps the traffic lights; below it the list
     spans the window and the reader is a drawer laid over the list. */
  .win.max { grid-template-rows: var(--tb-h) minmax(0, 1fr); }
  .win.max .sb { grid-row: 1; grid-column: 1; z-index: 2; border-right: 0; padding: 0; }
  .win.max .main { grid-row: 1 / -1; grid-column: 1 / -1; }
  .win.max .tb { padding-left: calc(var(--sb-w) + 14px); }
  .win.max .panes { grid-template-columns: minmax(0, 1fr); }
  .win.max .list, .win.max .reader.drawer { grid-row: 1; grid-column: 1; }
  .win.max .reader.drawer { justify-self: end; width: 62%; background: var(--pane); border-left: 1px solid var(--line); box-shadow: -12px 0 34px rgba(0,0,0,.18); z-index: 1; }
  .win.narrow { width: 760px; margin: 0 auto; --sb-w: 184px; --list-h: 40%; }
  .win.item { width: 820px; margin: 0 auto; grid-template-columns: minmax(0, 1fr); }
  .win.item .tb { position: relative; padding-left: 86px; }

  .st {
    display: flex; align-items: center; gap: 14px; padding: 0 14px; border-top: 1px solid var(--line);
    font: 11px var(--mono); color: var(--fg3); white-space: nowrap; min-width: 0;
  }
  .st-msg { color: var(--fg2); overflow: hidden; text-overflow: ellipsis; }
  .st kbd { font-size: 10px; padding: 2px 4px; }
  .st-sp { flex: 1; }
  .st .warn { color: var(--warn); }
  .st .fail { color: var(--danger); font-weight: 600; }
  .sbi-n .failed { color: var(--danger); background: color-mix(in srgb, var(--danger) 15%, transparent); border-radius: 8px; padding: 0 5px; line-height: 16px; }
  .sbi.outbox .ic { color: var(--danger); }
  .ob { margin-top: 14px; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 6px; }
  .ob.failed { border-left-color: var(--danger); }
  .ob h2 { margin: 0 0 6px; font-size: 13.5px; font-weight: 600; }
  .ob h2 button, .ob-top button { margin-left: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 1px 9px; background: transparent; color: var(--accent); font: inherit; font-size: 11px; font-weight: 400; }
  .ob-kv { display: grid; grid-template-columns: 64px 1fr; font-size: 12.5px; line-height: 1.6; }
  .ob-kv .k { color: var(--fg3); }
  .ob .why { color: var(--warn); }
  .ob.failed .why { color: var(--danger); }
  .ob pre { margin: 8px 0 0; white-space: pre-wrap; font: inherit; font-size: 12.5px; color: var(--fg2); }
  .ob-top { color: var(--fg2); font-size: 12.5px; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 5px; vertical-align: 1px; }

  /* Two-colour icons: one line in the accent, the rest in the text colour. Only where an
     icon names a place (sidebar, detail pane); elsewhere the line takes the outline's colour. */
  .sbi .ic .duo, .td-link .ic .duo, .guide .ic .duo { stroke: var(--duo, var(--accent)); }
  .ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Sidebar ---------- */
  .sbg { display: flex; align-items: center; gap: 6px; margin: 14px 8px 4px; font-size: 11px; font-weight: 600; color: var(--fg3); }
  .sbg .ic { width: 11px; height: 11px; margin-left: -1px; }
  .sbg.collapsed .ic { transform: rotate(-90deg); }
  .sbg .sbi-n { margin-left: auto; font-weight: 400; }
  .sbi {
    display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 8px 0 calc(8px + var(--d, 0) * 16px);
    border-radius: 6px; color: var(--fg); white-space: nowrap;
  }
  .sbi .ic { color: var(--fg3); }
  .sbi.on { background: var(--sb-active); }
  .sbi.on .ic { color: var(--fg); }
  .sbi.today .ic { --duo: var(--warn); }
  /* While Ctrl is held on its own (here too), each pin shows the key that opens it, over its icon. */
  .sbi .key { display: grid; place-items: center; min-width: 15px; height: 15px; border-radius: 4px;
    background: var(--accent); color: #fff; font: 600 10.5px/1 var(--mono); }
  [data-look="terminal"] .sbi .key { min-width: 0; height: auto; background: none; color: var(--accent); font: inherit; }
  .sbi .fold { display: flex; color: var(--fg3); margin-left: -2px; }
  .sbi .fold .ic { width: 11px; height: 11px; }
  .sbi .fold:not(.open) .ic { transform: rotate(-90deg); }
  .sbi-l { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .sbi-n { font: 11px var(--mono); color: var(--fg3); display: inline-flex; gap: 6px; }
  .sbi-mute { display: inline-flex; margin-left: 5px; color: var(--fg3); vertical-align: -1px; }
  .sbi-mute svg { width: 11px; height: 11px; }
  .sbi-n .staged { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); border-radius: 8px; padding: 0 5px; line-height: 16px; }
  .sbi-n .unread { color: var(--fg2); }

  /* ---------- Rows ---------- */
  .row, .sec {
    display: grid; align-items: center; column-gap: var(--col-gap);
    grid-template-columns: var(--cols); height: var(--row-h); padding: 0 var(--row-pad-r) 0 var(--row-pad-l);
    white-space: nowrap; position: relative;
  }
  .row > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .c-st { display: flex; justify-content: center; align-items: center; }
  .c-st i { font-style: normal; display: none; }
  .c-st i.s1[data-g="N"] { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .c-st i.s1[data-g="D"] { display: block; color: var(--danger); font: 600 12px var(--mono); }
  .c-st i.s1[data-g="D"]::before { content: "✕"; }
  /* Replied to or forwarded: an arrow, quieter than the unread dot. */
  .c-st i.s1[data-g="r"], .c-st i.s1[data-g="f"] { display: block; width: 11px; height: 11px; background: var(--fg3);
    mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>') center / contain no-repeat; }
  .c-st i.s1[data-g="f"] { mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 17 5-5-5-5"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg>'); }
  .c-from { color: var(--fg); display: flex; gap: 7px; align-items: baseline; }
  .c-from .nm { flex: 0 1 auto; min-width: 5ch; max-width: 55%; overflow: hidden; text-overflow: ellipsis; }
  .c-from .ad { flex: 0 100 auto; min-width: min-content; display: flex; color: var(--fg3); font-weight: 400; font-size: 12px; }
  .c-from .ad.only { color: var(--fg); font-size: inherit; }
  .c-from .ad.spoof { color: var(--danger); }
  .spw { display: inline-flex; align-items: center; color: var(--danger); margin-right: -3px; }
  .spw .ic { width: 12px; height: 12px; }
  .c-subj { color: var(--fg2); }
  .c-subj .s { color: var(--fg); }
  .c-subj .snip { color: var(--fg3); margin-left: 8px; }
  .c-meta { display: flex; gap: 7px; align-items: center; color: var(--fg3); justify-content: flex-end; }
  .c-meta .ic { width: 13px; height: 13px; }
  .c-meta > span { display: inline-flex; gap: 4px; align-items: center; }
  .c-meta .flag { color: var(--warn); }
  .c-meta .tagtxt { font-size: 12px; }
  .c-date { font: 11.5px var(--mono); color: var(--fg3); text-align: right; }
  .row.unread .c-from { font-weight: 600; }
  .row.unread .c-subj .s { font-weight: 500; }
  .row.unread .c-date { color: var(--fg2); }
  .thr {
    display: inline-block; font: 10.5px/15px var(--mono); color: var(--fg3); padding: 0 5px;
    border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line); margin-left: 7px; vertical-align: 1px;
  }
  .tree { display: inline-block; margin: 0 6px 0 calc(var(--d) * 14px); color: var(--fg3); font: 11px var(--mono); }
  .hl { font-size: 10.5px; line-height: 16px; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .stg { font: 10.5px/16px var(--mono); padding: 0 6px; border-radius: 4px; color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .fld { font-size: 11.5px; color: var(--fg3); }
  mark { background: color-mix(in srgb, var(--warn) 30%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
  .row.del .c-from, .row.del .c-subj { opacity: .45; }
  .row.del .c-subj .s { text-decoration: line-through; }
  .row.move .c-from, .row.move .c-subj { opacity: .6; }
  .row.cursor, .crow.cursor { background: var(--cursor-fill); --fg: var(--accent-fg); --fg2: rgba(255,255,255,.85); --fg3: rgba(255,255,255,.85); --accent: var(--accent-fg); --warn: var(--accent-fg); --danger: var(--accent-fg); --ok: var(--accent-fg); color: var(--fg); }

  .task .c-title { grid-column: 2 / 4; color: var(--fg); }
  .task.done .c-title { color: var(--fg3); text-decoration: line-through; }
  /* Being worked on (todo-spec §19): marked where it stands, and named in the status line. */
  .wk::before { content: "▶"; color: var(--accent); font-size: .8em; margin-right: 6px; }
  .look-terminal .wk::before { content: ">"; font-size: inherit; margin-right: 1ch; }
  .st .wkg { color: var(--accent); }
  .task .c-date.soon { color: var(--fg2); }
  .task .c-date.late { color: var(--danger); font-weight: 600; }
  .task .c-date.late::before { content: "! "; }
  /* Due today: as red as overdue, without the mark. */
  .task .c-date.today { color: var(--danger); font-weight: 600; }
  .prog svg { width: 12px; height: 12px; transform: rotate(-90deg); fill: none; stroke-width: 2.4; }
  .prog circle { stroke: color-mix(in srgb, var(--fg3) 45%, transparent); }
  .prog circle.arc { stroke: var(--accent); stroke-linecap: round; }
  .chk { width: 13px; height: 13px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--fg3); display: grid; place-items: center; flex: none; }
  .chk.on { background: var(--fg3); box-shadow: none; }
  .chk.on::after { content: ""; width: 6px; height: 3px; border: 1.6px solid var(--pane); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

  .sec { color: var(--fg3); font-size: 11px; font-weight: 600; height: var(--sec-h); }
  .sec .sec-t { grid-column: 2 / -1; display: flex; gap: 7px; align-items: center; }
  .sec .n { font: 400 11px var(--mono); }
  /* The half of Today with the keyboard: its label in the accent. */
  .sec.on { color: var(--accent); }
  .sec .sec-t .acc { margin-left: auto; display: inline-flex; padding: 2px; border-radius: 7px; background: var(--chip); text-transform: none; letter-spacing: 0; }
  .sec .sec-t .acc span { height: 20px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 5px; font: 400 12px var(--font); color: var(--fg3); }
  .sec .sec-t .acc span.on { background: var(--sb-active); color: var(--fg); }
  .acc.thsw + .acc { margin-left: 6px; }
  .acc.thsw span { padding: 0 7px; }
  .acc.thsw .ic { width: 13px; height: 13px; }
  .acc.thsw .tw { display: none; font-style: normal; }
  /* Group by tag (zg), at the end of the Tasks label: pressed while on. */
  .acc.tagsw span { padding: 0 7px; }
  .acc.tagsw .ic { width: 13px; height: 13px; }
  .acc.tagsw .tw { display: none; font-style: normal; }
  .day b.dic.untagged .ic { color: var(--fg3); }
  /* Due first (zd), before the tag switch in Today: the number due by today in red, on or off. */
  .acc.duesw span { padding: 0 7px; gap: 4px; }
  .acc.duesw .ic { width: 13px; height: 13px; }
  .acc.duesw .tw { display: none; font-style: normal; }
  .acc.duesw + .acc.tagsw { margin-left: 6px; }
  .sec .sec-t .acc.duesw span.dn { height: auto; padding: 0; color: var(--danger); font-weight: 600; font-variant-numeric: tabular-nums; }
  .day b.dic.due .ic { color: var(--danger); }
  .tb .acc.thsw { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--chip); }
  .tb .acc.thsw span { height: 22px; display: inline-flex; align-items: center; border-radius: 5px; color: var(--fg3); }
  .tb .acc.thsw span.on { background: var(--sb-active); color: var(--fg); }
  .look-hybrid .sec:has(.acc), .look-hybrid .col .sec { height: calc(var(--sec-h) + 10px); padding-bottom: 4px; }
  .gap { height: 8px; }

  /* Today in two columns: mail on the left, tasks on the right, one line each without snippets. */
  .lay { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--chip); cursor: pointer; }
  .lay span { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 5px; font-size: 12px; color: var(--fg3); white-space: nowrap; }
  .lay span.on { background: var(--sb-active); color: var(--fg); }
  .lay .ic { width: 13px; height: 13px; }
  .list.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); padding: 0; }
  .col { position: relative; overflow: hidden; min-width: 0; padding: 4px 0; }
  .col + .col { border-left: 1px solid var(--line); }
  .col .snip, .col .c-from .ad:not(.only) { display: none; }
  .col .c-from .nm { max-width: none; }
  .col .nm.spoof { color: var(--danger); }

  .cmd { color: var(--fg); font-size: 12px; }
  .cmd .caret { display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: -3px; margin-left: 1px; }
  /* What can follow a pending prefix key: k toggles it here. */
  .kh { position: absolute; right: 16px; bottom: calc(var(--st-h) + 8px); display: grid; grid-template-columns: auto 1fr; gap: 3px 12px;
    max-width: 440px; padding: 10px 14px; border-radius: 10px; font-size: 12px; color: var(--fg2);
    background: var(--menu-bg); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
    box-shadow: 0 12px 34px rgba(0,0,0,.32), 0 0 0 .5px var(--frame); }
  .kh kbd { justify-self: end; font: 12px var(--mono); color: var(--accent); background: none; box-shadow: none; padding: 0; }
  .kh .h kbd { color: var(--fg); }
  .kh .h span { color: var(--fg3); }
  .kh > div { display: contents; }
  /* A picker for several people: n toggles it here. */
  .pp-scrim { position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding-top: 90px; background: rgba(0,0,0,.18); }
  .pp { width: 440px; border-radius: 10px; overflow: hidden; background: var(--menu-bg);
    -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
    box-shadow: 0 16px 40px rgba(0,0,0,.35), 0 0 0 .5px var(--frame); font-size: 13px; }
  .pp .t { padding: 10px 12px 4px; font-size: 11px; font-weight: 600; color: var(--fg3); text-transform: uppercase; letter-spacing: .05em; }
  .pp .chips { display: flex; gap: 6px; padding: 6px 12px 0; }
  .pp .chips span { padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
  .pp .in { padding: 9px 12px; color: var(--fg); }
  .pp .r { display: flex; justify-content: space-between; padding: 6px 12px; color: var(--fg2); }
  .pp .r.on { background: var(--accent); color: #fff; }
  .pp .r .d { color: var(--fg3); font-size: 12px; }
  .pp .r.on .d { color: rgba(255,255,255,.75); }
  /* The ? overlay: every key of every mode, found by typing. ? toggles it here. */
  .hp-scrim { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,.4); }
  .hp { width: 720px; height: 470px; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: var(--pane);
    box-shadow: 0 22px 60px rgba(0,0,0,.45), 0 0 0 1px var(--frame); font-size: 12.5px; }
  .hp-h { display: flex; align-items: center; gap: 16px; padding: 14px 18px 10px; }
  .hp-h .t { font-size: 14px; font-weight: 600; }
  .hp-h .f { flex: 1; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 8px; background: var(--chip); color: var(--fg3); box-shadow: inset 0 0 0 1px var(--accent); }
  .hp-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 16px 10px; border-bottom: 1px solid var(--line); }
  .hp-tabs span { height: 24px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 12px; color: var(--fg2); font-size: 12px; white-space: nowrap; }
  .hp-tabs span.on { background: var(--accent); color: #fff; }
  .hp-b { flex: 1; overflow: hidden; padding: 10px 16px; columns: 2; column-gap: 20px; }
  .hp-g { break-inside: avoid; margin-bottom: 12px; }
  .hp-g h4 { margin: 0 0 4px; padding: 0 6px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); }
  .hp-r { display: grid; grid-template-columns: 100px 1fr; gap: 10px; padding: 3px 6px; border-radius: 5px; }
  .hp-r.on { background: var(--accent-soft); }
  .hp-r .k { display: flex; align-items: baseline; justify-content: flex-end; gap: 3px; }
  .hp-r .or { color: var(--fg3); font-size: 10px; }
  .hp-ft { display: flex; justify-content: space-between; padding: 9px 18px; border-top: 1px solid var(--line); background: var(--bg); color: var(--fg3); font-size: 11px; }
  .hp-ft code { color: var(--accent); font-family: var(--mono); }
  .look-terminal .kh, .look-terminal .pp, .look-terminal .hp { border-radius: 0; }
  .cmpl {
    position: absolute; left: 10px; bottom: calc(var(--st-h) + 6px); width: 540px; padding: 5px; border-radius: 9px;
    background: var(--menu-bg); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
    box-shadow: 0 12px 34px rgba(0,0,0,.32), 0 0 0 .5px var(--frame); font-size: 12.5px;
  }
  .cmpl .ci { display: grid; grid-template-columns: 190px 1fr auto; gap: 12px; align-items: center; height: 28px; padding: 0 9px; border-radius: 5px; }
  .cmpl .ci.on { background: var(--accent); color: var(--accent-fg); }
  .cmpl .ci.on * { color: inherit !important; }
  .cmpl .ci.on kbd { background: rgba(255,255,255,.2); }
  .cmpl .cn { font: 12px var(--mono); }
  .cmpl .cn b { color: var(--accent); font-weight: 700; }
  .cmpl .cn .arg, .cmpl .cd { color: var(--fg3); }

  .empty { height: 100%; display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; }
  .empty .ic.big { width: 34px; height: 34px; color: var(--fg3); stroke-width: 1.5; margin-bottom: 8px; }
  .empty h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .empty p { margin: 0; color: var(--fg3); }
  .empty .eh { display: flex; gap: 18px; margin-top: 14px; font-size: 12px; color: var(--fg3); }
  .empty .eh span { display: inline-flex; gap: 6px; align-items: center; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 6px;
    background: var(--chip); color: var(--fg2); font-size: 12px; white-space: nowrap;
  }
  .chip .ic { width: 13px; height: 13px; }
  .chip .dim { color: var(--fg3); font-family: var(--mono); font-size: 11px; }
  .chip.acc { color: var(--accent); background: var(--accent-soft); }
  .chip.acc .dim { color: inherit; opacity: .75; }
  .chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 20%, transparent); font-weight: 500; }

  /* ---------- Reader ---------- */
  .rd { padding: 22px 28px 22px var(--text-x); max-width: 760px; }
  .hdrs {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; align-items: baseline;
    grid-template-areas: "subj subj" "from date" "to to" "att att";
  }
  .h-subj { grid-area: subj; font-size: 17px; font-weight: 600; margin-bottom: 14px; letter-spacing: -.01em; line-height: 1.3; }
  .h-subj .thr { font-size: 11px; vertical-align: 2px; margin-left: 6px; }
  .h-from { grid-area: from; }
  .h-from b { font-weight: 600; }
  .h-from .addr { color: var(--fg3); margin-left: 6px; }
  .h-date { grid-area: date; color: var(--fg3); font: 11.5px var(--mono); }
  .h-to { grid-area: to; color: var(--fg3); font-size: 12px; }
  .look-hybrid .h-to::before { content: "to "; }
  .h-att { grid-area: att; display: flex; gap: 8px; margin-top: 14px; }
  .rd-body { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13.5px; line-height: 1.6; color: var(--fg); }
  .rd-body p { margin: 0 0 12px; }
  .rd-body .lnk { color: var(--accent); text-decoration: underline; }
  .rd-notices { margin-top: 14px; display: grid; gap: 4px; }
  .notice.warn { display: flex; align-items: center; gap: 6px; color: var(--danger); font-size: 12px; }
  .notice.warn .ic { width: 12px; height: 12px; flex: none; }
  .notice.warn b { font-weight: 600; }
  .chip.risky { color: var(--danger); }

  /* ---------- Task detail ---------- */
  /* The pane has no left padding of its own: the checkbox centres on the list's status column,
     and everything else starts at --text-x, so list and detail share both edges. */
  .td { padding: 22px 28px 22px 0; max-width: 820px; }
  .td-title {
    display: flex; align-items: center; margin-bottom: 12px;
    padding-left: calc(var(--row-pad-l) + (var(--status-w) - var(--chk-w)) / 2);
    gap: calc((var(--status-w) - var(--chk-w)) / 2 + var(--col-gap));
  }
  .td-title h2 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .td-title .chk { width: var(--chk-w); height: var(--chk-w); border-radius: 5px; }
  .props { display: flex; gap: 6px; flex-wrap: wrap; padding-left: var(--text-x); }
  .props .p { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 6px; background: var(--chip); color: var(--fg2); font-size: 12px; }
  .props .p .ic { width: 13px; height: 13px; }
  .look-hybrid .props .p .pk + .pv { margin-left: -2px; }
  .props .p.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 20%, transparent); font-weight: 500; }
  .td-hints { margin: 10px 0 0 var(--text-x); color: var(--fg3); font-size: 11.5px; display: flex; gap: 14px; flex-wrap: wrap; }
  .td-hints span { display: inline-flex; gap: 5px; align-items: center; }
  .td-notes { margin: 18px 0 0 var(--text-x); font-size: 13.5px; line-height: 1.6; }
  .td-h { margin: 22px 0 6px var(--text-x); font-size: 11px; font-weight: 600; color: var(--fg3); display: flex; align-items: center; gap: 7px; }
  .td-h .n { font: 400 11px var(--mono); }
  .pbar { width: 64px; height: 3px; border-radius: 2px; background: var(--chip); margin-left: 2px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .steps, .td-link, .td-log { margin-left: calc(var(--text-x) - var(--item-px)); }
  .step { display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 var(--item-px); border-radius: 6px; }
  .step.done span:last-child { color: var(--fg3); text-decoration: line-through; }
  .step.next span:last-child { color: var(--fg); font-weight: 500; }
  .step .st-input .caret { display: inline-block; width: 1.5px; height: 14px; background: var(--accent); vertical-align: -2px; margin-left: 1px; }
  .step .st-input { flex: 1; height: 22px; line-height: 20px; margin-left: -7px; padding: 0 6px; border: 1px solid var(--accent); border-radius: 4px; background: var(--pane); color: var(--fg); }
  .td-link { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 var(--item-px); border-radius: 6px; color: var(--fg2); white-space: nowrap; }
  .td-link:hover { background: var(--hover); }
  .td-link .lk { display: flex; color: var(--fg3); }
  .td-link b { color: var(--fg); font-weight: 500; }
  .td-link .su { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .td-link .rs { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
  .td-link .rs .ic { width: 13px; height: 13px; }
  .td-link .rs.ok { color: var(--ok); }
  .td-link .rs.no { color: var(--warn); }
  .td-link .r { margin-left: auto; color: var(--fg3); font: 11px var(--mono); }
  .td-link .rs + .r { margin-left: 14px; min-width: 76px; text-align: right; }
  .td-log { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 12px; padding: 0; list-style: none; }
  .td-log li { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; padding: 4px var(--item-px); color: var(--fg2); }
  .td-log time { font: 11px/19px var(--mono); color: var(--fg3); white-space: nowrap; }

  /* ---------- Compose window ---------- */
  .win.compose .fl .chk { color: var(--warn); gap: 6px; }
  .win.compose .fl .chk .ic { width: 12px; height: 12px; }
  .win.compose { width: 960px; height: 640px; margin: 0 auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: 46px auto minmax(0, 1fr); background: var(--pane); }
  .ctb { position: relative; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 86px; border-bottom: 1px solid var(--line); background: var(--sb-bg); }
  .ctb .lights { top: 17px; }
  .ct { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .saved { color: var(--fg3); font: 11px var(--mono); }
  .btn { font: inherit; font-size: 12.5px; border: 0; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 7px; background: var(--chip); color: var(--fg2); cursor: pointer; }
  .btn .ic { width: 14px; height: 14px; }
  .btn.pri { background: var(--accent); color: #fff; font-weight: 600; padding: 0 7px 0 12px; }
  .btn.pri kbd { background: rgba(255,255,255,.2); color: #fff; }
  .fields { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .fl { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; min-height: 32px; padding: 0 18px; }
  .fl .k { color: var(--fg3); }
  .fl .v { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .fl .v .chev { width: 12px; height: 12px; color: var(--fg3); }
  .fl .addr { color: var(--fg3); }
  .fl .r { color: var(--fg3); font-size: 12px; }
  .fl .subj { font-weight: 600; }
  .tok { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 5px; background: var(--accent-soft); }
  .tok.lifted { opacity: 0.35; }
  .tok.ghost { position: relative; left: 14px; top: 7px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); cursor: grabbing; }
  .tok-caret { display: inline-block; width: 2px; height: 22px; margin-left: 4px; border-radius: 1px; background: var(--accent); vertical-align: middle; }
  .nv { display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: 14px 18px 0; font: 12.5px/20px var(--mono); }
  .nv .ln { white-space: pre; min-height: 20px; }
  .nv .q { color: var(--fg3); }
  .nv .sig { color: var(--fg3); font-style: italic; }
  .nv .eob { color: var(--fg3); opacity: .45; }
  .nv .cur { display: inline-block; width: 2px; height: 16px; background: var(--accent); vertical-align: -3px; margin-left: 1px; }
  .nvs { margin: auto -18px 0; display: flex; gap: 14px; align-items: center; height: 24px; padding: 0 18px; border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--fg3); }
  .nvs .mode { color: var(--ok); font-weight: 700; }

  /* ---------- Search and filter ---------- */
  /* Task results under a day heading, as in Things: the number big, the day after it on a rule. */
  .day { display: flex; align-items: flex-end; gap: 8px; height: 46px; padding: 10px var(--row-pad-r) 5px var(--row-pad-l); }
  .day b { font-size: 22px; line-height: 20px; font-weight: 700; letter-spacing: -.03em; color: var(--fg); min-width: var(--status-w); }
  .day b.mon { font-size: 15px; letter-spacing: -.01em; }
  .day b.dic { display: flex; justify-content: center; }
  .day b.dic .ic { width: 17px; height: 17px; color: var(--fg2); }
  .day b.dic.sunny .ic { color: var(--warn); }
  .day .dl { flex: 1; display: flex; gap: 7px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 5px; font-size: 12.5px; line-height: 14px; font-weight: 600; color: var(--fg3); }
  .day .dl .n { margin-left: auto; font: 400 11px var(--mono); }
  .day .dl .fold { font-weight: 400; }
  .tb .qchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 7px; background: var(--pane); box-shadow: inset 0 0 0 1px var(--frame); white-space: nowrap; }
  .tb .qchip .ic { width: 13px; height: 13px; color: var(--fg3); }
  .tb .qchip .tokn { height: 18px; font-size: 11.5px; padding: 0 6px; }
  .tb .scope { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 6px; color: var(--fg2); font-size: 12px; white-space: nowrap; }
  .tb .scope:hover { background: var(--chip); }
  .tb .scope .ic { width: 11px; height: 11px; color: var(--fg3); }
  .lay .c { font: 11px var(--mono); color: var(--fg3); }
  .sortbtn.on { background: var(--accent-soft); color: var(--accent); }
  .sortbtn.on .ic { color: inherit; }
  .sortbtn kbd { margin-left: 2px; }

  /* The filter: a bar at the top of the list it narrows, live as it is typed. */
  .fbar { display: flex; align-items: center; gap: 8px; height: 30px; margin: 2px 8px 6px; padding: 0 6px 0 10px; border-radius: 7px;
    background: var(--pane); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .fbar .ic { width: 13px; height: 13px; color: var(--accent); }
  .fbar .fk { color: var(--fg3); font-size: 12px; }
  .fbar .q { flex: 1; }
  .fbar .q .caret { display: inline-block; width: 1.5px; height: 15px; background: var(--accent); vertical-align: -3px; margin-left: 1px; }
  .fbar .cnt { font: 11px var(--mono); color: var(--fg3); }

  /* The search field, floating over the window as it does today. */
  .ov { position: absolute; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-start; padding-top: 92px; background: rgba(0,0,0,.42); }
  .light .ov { background: rgba(0,0,0,.12); }
  .sp { width: 660px; border-radius: 12px; overflow: hidden; background: var(--menu-bg); font-size: 13px;
    -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
    box-shadow: 0 24px 60px rgba(0,0,0,.4), 0 0 0 .5px var(--frame), inset 0 .5px 0 rgba(255,255,255,.08); }
  .sp-f { display: flex; align-items: center; gap: 7px; height: 48px; padding: 0 14px; font-size: 15px; border-bottom: 1px solid var(--line); }
  .sp-f > .ic { width: 17px; height: 17px; color: var(--fg3); }
  .sp-f .caret { display: inline-block; width: 2px; height: 19px; background: var(--accent); vertical-align: -4px; margin-left: 1px; }
  .sp-f .tb-sp { flex: 1; }
  .tokn { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; white-space: nowrap; }
  .tokn .k { font: 11px var(--mono); opacity: .75; }
  .sp-kind { display: inline-flex; align-items: center; padding: 2px; border-radius: 7px; background: var(--chip); font-size: 12px; }
  .sp-kind > span { padding: 2px 10px; border-radius: 5px; color: var(--fg3); }
  .sp-kind > span.on { background: var(--sb-active); color: var(--fg); }
  .sp-kind kbd { margin: 0 4px 0 6px; }
  .sp-scope { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .sp-scope .lb { color: var(--fg3); font-size: 11.5px; margin-right: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; color: var(--fg2); box-shadow: inset 0 0 0 1px var(--frame); white-space: nowrap; }
  .pill .ic { width: 12px; height: 12px; }
  .pill.on { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
  .pill .n { font: 10.5px var(--mono); opacity: .8; }
  .sp-scope kbd { margin-left: auto; }
  .sp-body { padding: 5px; max-height: 330px; overflow: hidden; }
  .sp-h { padding: 7px 9px 3px; font-size: 11px; font-weight: 600; color: var(--fg3); }
  .sp-i { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; height: 30px; padding: 0 9px; border-radius: 6px; white-space: nowrap; }
  .sp-i > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sp-i > :nth-last-child(2) { grid-column: 2; }
  .sp-i > :last-child { grid-column: 3; }
  .sp-i .ic { width: 14px; height: 14px; color: var(--fg3); }
  .sp-i .d { color: var(--fg3); }
  .sp-i code { font: 11px var(--mono); color: var(--fg3); }
  .sp-i.on { background: var(--accent); color: var(--accent-fg); }
  .sp-i.on * { color: inherit !important; }
  .sp-i.on kbd { background: rgba(255,255,255,.2); }
  .sp-i .chk { margin-left: 2px; }
  .sp-i.on .chk { box-shadow: inset 0 0 0 1.5px var(--accent-fg); }
  .sp-i.sub { padding-left: 27px; }
  .sp-i .fl2 { display: flex; gap: 7px; align-items: center; }
  .sp-i b { font-weight: 600; }
  .sp-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--fg3); }
  .sp-foot code { font: 11px var(--mono); color: var(--fg2); }

  /* ---------- Today as one list ---------- */
  /* Mail, chat and reading on one timeline on the left, the tasks beside it. A kind column names
     what each row of the timeline is. */
  .list.mixed .col.m { --cols: var(--status-w) 15px 150px minmax(0, 1fr) auto 46px; }
  /* As in columns, the sender is the name alone; a spoofed one turns red and the reader shows the address. */
  .list.mixed .c-from .ad:not(.only) { display: none; }
  .list.mixed .c-from .nm { max-width: none; }
  .list.mixed .nm.spoof { color: var(--danger); }
  .sortbtn { white-space: nowrap; }
  .list.mixed .c-kind { display: flex; justify-content: center; color: var(--fg3); }
  .list.mixed .c-kind .ic { width: 13px; height: 13px; }
  .list.mixed .row.unread .c-kind { color: var(--fg2); }
  .list.mixed .col.m .sec .sec-t { grid-column: 2 / -1; }

  /* ---------- Chat ---------- */
  /* Waiting and a room's threads are mail rows: the newest author where the sender goes, the room
     and the thread's first message where the subject goes, the newest message as the snippet. */
  .rm { font-size: 11.5px; color: var(--fg3); margin-right: 8px; }
  .row.chat .c-from .nm { max-width: none; }
  .c-st i.s1[data-g="@"] { display: block; color: var(--accent); font: 700 12px var(--mono); }
  .c-st i.s1[data-g="@"]::before { content: "@"; }
  .sbi .pr { width: 15px; display: flex; justify-content: center; flex: none; }
  .sbi .pr::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .sbi .pr.away::before { background: var(--warn); }
  .sbi .pr.off::before { background: none; box-shadow: inset 0 0 0 1.5px var(--fg3); }

  /* A mail conversation in the reader: the header pinned, the messages a stack of cards under it. */
  .rd.conv { padding-top: 18px; }
  .conv-hdrs { grid-template-areas: "subj subj" "sub sub" "att att"; }
  .conv-hdrs .h-subj { margin-bottom: 4px; }
  .conv-sub { grid-area: sub; color: var(--fg3); font-size: 12px; }
  .conv-sub b { color: var(--accent); font-weight: 500; }
  .conv-stack { margin-top: 14px; display: grid; gap: 6px; }
  .card { border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
  .card.focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .card-head { display: grid; grid-template-columns: 7px auto minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 7px 12px; white-space: nowrap; }
  .card-dot { width: 7px; height: 7px; border-radius: 50%; }
  .card.unread .card-dot { background: var(--accent); }
  .card-who { color: var(--fg2); }
  .card.open .card-who, .card.unread .card-who { color: var(--fg); font-weight: 600; }
  .card-pv { overflow: hidden; text-overflow: ellipsis; color: var(--fg3); font-size: 12px; }
  .card-when { color: var(--fg3); font: 11.5px var(--mono); }
  .card-body { padding: 0 12px 10px 29px; font-size: 13.5px; line-height: 1.6; }
  .card-body p { margin: 0 0 8px; }
  .card-body .h-att { margin: 0 0 8px; }
  .look-terminal .conv-stack { gap: 0; }
  .look-terminal .card { border-radius: 0; box-shadow: none; border-bottom: 1px dashed var(--line); }
  .look-terminal .card.focus > .card-head { background: var(--cursor-bg); }

  /* The reader as a conversation: the thread's title, its messages oldest first and ending at the
     newest, and the composer under them. */
  .reader.chat { display: flex; flex-direction: column; }
  .cv-h { padding: 14px 28px 10px var(--text-x); border-bottom: 1px solid var(--line); }
  .cv-t { font-size: 15px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cv-m { margin-top: 3px; color: var(--fg3); font-size: 12px; display: flex; gap: 12px; align-items: center; white-space: nowrap; }
  .cv-m .wt { color: var(--warn); }
  .cv-m .chip { margin-left: auto; height: 22px; }
  .cv-msgs { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 28px 10px 0; }
  .cm { display: grid; grid-template-columns: var(--text-x) minmax(0, 1fr); margin-top: 8px; padding: 3px 0; border-radius: 6px; }
  .cm.cont { margin-top: 3px; }
  .cm.hover { background: var(--hover); }
  .cm-gt { justify-self: end; margin-right: 5px; font: 9.5px var(--mono); line-height: 20px; color: var(--fg3); visibility: hidden; }
  .cm.cont.hover .cm-gt { visibility: visible; }
  .av { justify-self: end; margin-right: 8px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font: 600 9.5px var(--font); color: #fff; background: var(--avc, #777); }
  .cm-b { grid-column: 2; justify-self: start; position: relative; min-width: 0; max-width: 100%; }
  .cm-h { display: flex; gap: 8px; align-items: baseline; }
  .cm-h b { font-weight: 600; }
  .cm-h time { font: 11px var(--mono); color: var(--fg3); }
  .cm.me .cm-h b { color: var(--fg2); }
  .cm-x { font-size: 13.5px; line-height: 1.5; }
  .men { color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 3px; font-weight: 500; }
  .men.me { color: var(--warn); background: color-mix(in srgb, var(--warn) 18%, transparent); }
  .cm .chip { margin-top: 4px; }
  .rx { display: inline-flex; gap: 4px; align-items: center; margin-top: 4px; height: 20px; padding: 0 7px; border-radius: 10px;
    font-size: 11.5px; color: var(--fg2); box-shadow: inset 0 0 0 1px var(--frame); }
  .cm-quote { margin: 4px 0; padding: 2px 0 2px 10px; border-left: 2px solid var(--frame); color: var(--fg2); }
  .cm-quote b { display: block; font-size: 12px; font-weight: 600; }
  .cm-tools { position: absolute; z-index: 2; top: -4px; left: calc(100% + 12px); display: inline-flex; align-items: center; gap: 1px; padding: 2px;
    border-radius: 8px; background: var(--pane); box-shadow: 0 6px 18px rgba(0, 0, 0, .3), 0 0 0 .5px var(--frame); white-space: nowrap; }
  .cm-tools span { display: inline-grid; place-items: center; min-width: 26px; height: 24px; border-radius: 5px; color: var(--fg2); }
  .cm-tools span.q { font-size: 15px; }
  .cm-tools .sep { align-self: stretch; width: 1px; margin: 4px 3px; background: var(--frame); }
  .cm-tools .ic { width: 13px; height: 13px; }
  .cv-fold { margin: 2px 0 6px var(--text-x); font-size: 12px; color: var(--accent); }
  .cv-day { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px var(--text-x); font-size: 10.5px; font-weight: 600;
    color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; }
  .cv-day::after { content: ""; flex: 1; height: 1px; background: var(--frame); }
  .cv-new { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px var(--text-x); font-size: 10.5px; font-weight: 600;
    color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .cv-new::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--accent) 45%, transparent); }

  .cc { position: relative; margin: 0 20px 14px var(--text-x); border-radius: 9px; box-shadow: inset 0 0 0 1px var(--frame); }
  .cc.on { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cc-a { display: flex; gap: 6px; padding: 8px 10px 0; }
  .cc-x { padding: 8px 12px 2px; min-height: 34px; font-size: 13.5px; line-height: 1.5; }
  .cc-x .ph { color: var(--fg3); margin-right: 6px; }
  .cc-x .caret { display: inline-block; width: 1.5px; height: 16px; background: var(--accent); vertical-align: -3px; margin-left: 1px; }
  .cc-f { display: flex; align-items: center; gap: 4px; padding: 2px 6px 6px 12px; }
  .cc-f .tsh { display: inline-flex; gap: 7px; align-items: center; color: var(--fg3); font-size: 12px; margin-right: auto; }
  .cc-f .ib { display: inline-flex; width: 26px; height: 24px; align-items: center; justify-content: center; border-radius: 6px; color: var(--fg3); }
  .cc-f .btn { height: 24px; }
  .mpop { position: absolute; left: 0; bottom: calc(100% + 6px); width: 340px; padding: 5px; border-radius: 9px; background: var(--menu-bg);
    -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
    box-shadow: 0 12px 34px rgba(0,0,0,.32), 0 0 0 .5px var(--frame); font-size: 12.5px; }
  .mpop .ci { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 9px; align-items: center; height: 30px; padding: 0 8px; border-radius: 5px; }
  .mpop .ci .av { margin: 0; width: 20px; height: 20px; }
  .mpop .ci .d { color: var(--fg3); font: 11px var(--mono); }
  .mpop .ci.on { background: var(--accent); color: var(--accent-fg); }
  .mpop .ci.on .d { color: inherit; }

  /* The chat window's list is narrow, so its rows take two lines: who and where, then the preview. */
  .crow { display: grid; grid-template-columns: var(--status-w) minmax(0, 1fr) auto; column-gap: var(--col-gap); row-gap: 1px;
    padding: 6px var(--row-pad-r) 7px var(--row-pad-l); align-items: baseline; white-space: nowrap; }
  .crow > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .crow .c-st { grid-row: 1; align-self: center; }
  .crow .c-who b { font-weight: 400; }
  .crow.unread .c-who b { font-weight: 600; }
  .crow .c-prev { grid-column: 2 / -1; color: var(--fg3); font-size: 12.5px; }
  .crow .c-prev .s { color: var(--fg2); }

  /* ---------- Templates ---------- */
  /* A placeholder where it stands: amber while it waits, the accent once filled, ringed while typed into. */
  .ph { border-radius: 4px; padding: 0 3px; color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 45%, transparent); }
  .ph.ok { color: var(--fg); background: var(--accent-soft); box-shadow: none; }
  .ph.typing { color: var(--fg); background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .ph .caret, .pf .caret { display: inline-block; width: 1.5px; height: 14px; background: var(--accent); vertical-align: -2px; margin-left: 1px; }

  /* The picker: templates on the left, the one under the cursor on the right, as it will be written. */
  .tp { width: 880px; height: 520px; display: grid; grid-template-columns: 330px minmax(0, 1fr); grid-template-rows: 48px minmax(0, 1fr) auto;
    border-radius: 12px; overflow: hidden; background: var(--menu-bg); font-size: 13px;
    -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
    box-shadow: 0 24px 60px rgba(0,0,0,.4), 0 0 0 .5px var(--frame), inset 0 .5px 0 rgba(255,255,255,.08); }
  .tp .sp-f { grid-column: 1 / -1; }
  .tp-l { padding: 5px; border-right: 1px solid var(--line); overflow: hidden; }
  .tp-i { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 1px; align-items: center;
    padding: 6px 9px; border-radius: 7px; white-space: nowrap; }
  .tp-i > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tp-i .ic { width: 14px; height: 14px; color: var(--fg3); }
  .tp-i .s { grid-column: 2 / -1; font-size: 12px; color: var(--fg3); }
  .tp-i .n { font: 10.5px var(--mono); color: var(--fg3); padding: 0 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line); }
  .tp-i.on { background: var(--accent); color: var(--accent-fg); }
  .tp-i.on * { color: inherit !important; }
  .tp-i.on .n { box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
  .tp-i mark { background: none; color: var(--accent); font-weight: 700; padding: 0; }
  .tp-i.on mark { text-decoration: underline; text-underline-offset: 2px; }
  .tp-r { position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: color-mix(in srgb, var(--pane) 55%, transparent); }
  .tp-h { padding: 16px 22px 12px; border-bottom: 1px solid var(--line); }
  .tp-h .t { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .tp-kv { display: grid; grid-template-columns: 64px 1fr; row-gap: 3px; margin-top: 10px; font-size: 12.5px; }
  .tp-kv .k { color: var(--fg3); }
  .tp-ph { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--fg3); }
  .tp-ph .ph { font-size: 12px; }
  .tp-ph .auto { color: var(--fg3); font-size: 11.5px; }
  .tp-b { flex: 1; min-height: 0; overflow: hidden; padding: 14px 22px; font-size: 13px; line-height: 1.55; color: var(--fg2); }
  .tp-b p { margin: 0 0 9px; }
  .tp-b ul { margin: 0 0 9px; padding-left: 18px; }
  .tp-r::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 50px; pointer-events: none;
    background: linear-gradient(transparent, color-mix(in srgb, var(--pane) 80%, transparent)); }
  .tp .sp-foot { grid-column: 1 / -1; align-items: center; }
  .tp .sp-foot .path { margin-right: auto; font: 11px var(--mono); color: var(--fg3); }

  /* Filling in: one field per placeholder, in the header block, in the order they appear. */
  .fl.fill { align-items: start; padding-top: 6px; padding-bottom: 8px; background: color-mix(in srgb, var(--accent) 5%, transparent);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 4px 0; }
  .fl.fill .k { line-height: 24px; color: var(--accent); font-weight: 500; }
  .pfs { display: flex; flex-wrap: wrap; gap: 8px 10px; }
  .pf { display: grid; grid-template-rows: auto 26px; row-gap: 3px; min-width: 150px; }
  .pf .lb { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--fg3); }
  .pf .lb .from { color: var(--fg3); opacity: .85; }
  .pf .lb .ic { width: 11px; height: 11px; color: var(--ok); }
  .pf .in { display: flex; align-items: center; height: 26px; padding: 0 8px; border-radius: 6px; background: var(--pane);
    box-shadow: inset 0 0 0 1px var(--frame); white-space: nowrap; }
  .pf.ok .in { color: var(--fg); }
  .pf.cur .in { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 3px var(--accent-soft); }
  .pf.cur .lb { color: var(--accent); }
  .pf.todo .in { color: var(--fg3); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 55%, transparent); }
  .pf.todo .lb { color: var(--warn); }
  .fl.fill .r { line-height: 24px; display: grid; justify-items: end; gap: 2px; padding-top: 0; }
  .fl.fill .r .left { color: var(--warn); font-weight: 500; }
  .fl.fill .r .keys { font-size: 11px; display: flex; gap: 8px; align-items: center; line-height: 1; }
  .win.compose.tall { height: 700px; }
  .btn.tpl { color: var(--accent); background: var(--accent-soft); max-width: 210px; }
  .btn.tpl span { overflow: hidden; text-overflow: ellipsis; }
  .win.compose .btn { white-space: nowrap; flex: none; }
  .win.compose .fl .v.chk { width: auto; height: auto; box-shadow: none; border-radius: 0; display: flex; place-items: normal; }

  /* A sheet out of the title bar, as macOS asks before an action. */
  .sheet-scrim { position: absolute; inset: 46px 0 0; z-index: 5; display: flex; justify-content: center; align-items: flex-start; background: rgba(0,0,0,.28); }
  .light .sheet-scrim { background: rgba(0,0,0,.12); }
  .sheet { width: 480px; padding: 20px 22px 16px; border-radius: 0 0 12px 12px; background: var(--menu-bg);
    -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
    box-shadow: 0 18px 50px rgba(0,0,0,.4), 0 0 0 .5px var(--frame); }
  .sheet-h { display: flex; gap: 12px; align-items: flex-start; }
  .sheet-h .badge { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .sheet-h .badge.acc { background: var(--accent-soft); color: var(--accent); }
  .sheet-h .badge .ic { width: 18px; height: 18px; }
  .sheet-h h3 { margin: 1px 0 3px; font-size: 14px; font-weight: 600; }
  .sheet-h p { margin: 0; color: var(--fg2); font-size: 12.5px; }
  .sheet-l { margin: 14px 0 4px; display: grid; gap: 2px; }
  .sheet-l .it { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 10px; align-items: center; height: 30px; padding: 0 9px; border-radius: 6px; }
  .sheet-l .it.on { background: var(--accent-soft); }
  .sheet-l .it .ph { justify-self: start; }
  .sheet-scrim.pick .tp { width: 900px; height: 520px; border-radius: 0 0 12px 12px; }
  .btn.tpl.on { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .btn.tpl kbd { background: var(--accent-soft); color: inherit; }
  .win.compose .saved { white-space: nowrap; }
  .sheet-l .it .ctx { color: var(--fg3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-l .it .ln { font: 11px var(--mono); color: var(--fg3); }
  .sheet-l .it.other .ic { width: 13px; height: 13px; color: var(--warn); }
  .sheet-f { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .sheet-f .btn kbd { margin-left: 2px; }
  .sheet-f .btn.quiet { margin-right: auto; background: none; }
  .form { display: grid; grid-template-columns: 80px minmax(0, 1fr); row-gap: 10px; column-gap: 12px; align-items: center; margin-top: 16px; font-size: 12.5px; }
  .form .k { color: var(--fg3); text-align: right; }
  .form .in { display: flex; align-items: center; height: 28px; padding: 0 9px; border-radius: 6px; background: var(--pane); box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 3px var(--accent-soft); }
  .form .in .caret { display: inline-block; width: 1.5px; height: 15px; background: var(--accent); margin-left: 1px; }
  .form .path { grid-column: 2; margin-top: -4px; font: 11px var(--mono); color: var(--fg3); }
  .form .path b { color: var(--fg2); font-weight: 400; }
  .form .opts { display: flex; flex-direction: column; gap: 6px; }
  .form .opt { display: flex; gap: 8px; align-items: center; color: var(--fg2); }
  .form .opt .chk { width: 14px; height: 14px; }
  .form .opt .chk.on { background: var(--accent); }
  .form .seg { background: var(--chip); }
  .form .seg span { display: inline-block; padding: 3px 11px; border-radius: 6px; font-size: 12px; color: var(--fg2); }
  .form .seg span.on { background: var(--sb-active); color: var(--fg); }
  .sheet .tip { margin-top: 12px; padding: 8px 10px; border-radius: 7px; background: var(--chip); color: var(--fg2); font-size: 12px; }

  /* ================= Hybrid look ================= */
  .look-hybrid { --sb-w: 224px; --sb-top: 44px; --tb-h: 40px; --st-h: 26px; --row-h: 24px; --sec-h: 30px;
                 --list-h: 46%; --cols: var(--status-w) 300px minmax(0, 1fr) auto 58px; }
  .look-hybrid.tasks { --cols: var(--status-w) minmax(0, 1fr) 0 auto 58px; }
  .look-hybrid .only-t { display: none !important; }
  .look-hybrid .sbg, .look-hybrid .sec { text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; }
  .look-hybrid .st .mode { display: none; }
  .look-hybrid .col.m { --cols: var(--status-w) 150px minmax(0, 1fr) auto 46px; }
  .look-hybrid .col.t { --cols: var(--status-w) minmax(0, 1fr) 0 auto 58px; }
  .look-hybrid .list.chat { --cols: var(--status-w) 150px minmax(0, 1fr) auto 58px; }

  /* ================= Terminal look ================= */
  .look-terminal {
    --font: "SF Mono", ui-monospace, Menlo, monospace;
    --sb-w: 212px; --sb-top: 40px; --tb-h: 34px; --st-h: 24px; --row-h: 24px; --sec-h: 26px; --list-h: 48%;
    --row-pad-l: 14px; --row-pad-r: 14px; --status-w: 4ch; --col-gap: 1ch; --chk-w: 3ch; --item-px: 0px;
    --cols: var(--status-w) 7ch 40ch minmax(0, 1fr) auto;
    font-size: 12px;
  }
  .look-terminal.tasks { --cols: var(--status-w) 7ch minmax(0, 1fr) 0 auto; }
  .look-terminal.dark {
    --sb-bg: rgba(22, 23, 30, .78); --pane: #16171e;
    --fg: #c8cee8; --fg2: #9aa1c2; --fg3: #8a91b8; --accent: #7aa2f7; --accent-soft: rgba(122,162,247,.14);
    --cursor-bg: rgba(255,255,255,.09); --warn: #e0af68; --danger: #f7768e; --ok: #9ece6a; --line: rgba(255,255,255,.06);
  }
  .look-terminal.light {
    --sb-bg: rgba(228, 230, 238, .78); --fg: #343b58; --fg2: #484d6b; --fg3: #5a5e7c; --accent: #2458c6;
    --cursor-bg: rgba(0,0,0,.12); --warn: #7d510b; --danger: #b02f4c; --ok: #336a19;
  }
  .look-terminal .only-h, .look-terminal .ic, .look-terminal .prog svg, .look-terminal .pbar { display: none !important; }
  .look-terminal .lbl { text-transform: lowercase; }

  /* Sidebar */
  .look-terminal .sbg { margin: 12px 6px 2px; gap: 1ch; font-size: 12px; font-weight: 400; }
  .look-terminal .sbg::before, .look-terminal .fold::before { content: "▾"; }
  .look-terminal .sbg.collapsed::before, .look-terminal .fold:not(.open)::before { content: "▸"; }
  .look-terminal .sbi { height: 22px; padding: 0 6px 0 calc(6px + var(--d, 0) * 2ch); border-radius: 3px; gap: 0; }
  .look-terminal .sbi .fold { margin-left: 1ch; }
  .look-terminal .sbi.on { background: var(--accent-soft); color: var(--accent); }
  .look-terminal .sbi.today .sbi-l { color: var(--warn); }
  .look-terminal .sbi-n { font-size: 12px; }
  .look-terminal .sbi-n .staged { background: none; padding: 0; }
  .look-terminal .sbi-n .staged::before, .look-terminal .thr::before, .look-terminal .prog .tagtxt::before { content: "["; }
  .look-terminal .sbi-n .staged::after, .look-terminal .thr::after, .look-terminal .prog .tagtxt::after { content: "]"; }

  /* Toolbar, menu, search, status line */
  .look-terminal .tb { gap: 10px; }
  .look-terminal .tb-t { font-size: 12px; color: var(--accent); }
  .look-terminal .col.m { --cols: var(--status-w) 7ch 16ch minmax(0, 1fr) auto; }
  .look-terminal .col.t { --cols: var(--status-w) 8ch minmax(0, 1fr) 0 auto; }
  .look-terminal .list.chat { --cols: var(--status-w) 7ch 16ch minmax(0, 1fr) auto; }
  .look-terminal .lay { background: none; padding: 0; gap: 1ch; }
  .look-terminal .lay span { padding: 0; height: auto; font-size: 12px; }
  .look-terminal .lay span.on { background: none; color: var(--accent); }
  .look-terminal .lay span.on::before { content: "["; }
  .look-terminal .lay span.on::after { content: "]"; }
  .look-terminal .search { background: none; box-shadow: none; width: auto; padding: 0; height: auto; }
  .look-terminal .search kbd { order: -1; }
  .look-terminal .search.on { color: var(--accent); }
  .look-terminal .search.on kbd { display: none; }
  .look-terminal .search.on .q::before { content: "/"; }
  .look-terminal .sortbtn { padding: 0 6px; height: 22px; border-radius: 3px; }
  .look-terminal .menu { width: 270px; border-radius: 4px; font-size: 12px; top: 26px; }
  .look-terminal .menu .mh { font-weight: 400; }
  .look-terminal .menu .mi { height: 22px; border-radius: 2px; }
  .look-terminal .st { padding: 0; gap: 0; font-size: 11.5px; }
  .look-terminal .st > span { padding: 0 12px; }
  .look-terminal .st .mode { background: var(--accent); color: var(--pane); font-weight: 700; align-self: stretch; display: flex; align-items: center; }
  .look-terminal .st .seg2 { background: var(--chip); align-self: stretch; display: flex; align-items: center; color: var(--fg2); }
  .look-terminal .cmpl { left: 0; right: 0; width: auto; bottom: var(--st-h); border-radius: 0; padding: 0; box-shadow: 0 -1px 0 var(--line); font-size: 12px; }
  .look-terminal .cmpl .ci { border-radius: 0; height: 22px; padding: 0 12px; }

  /* Rows: date first, a three-letter flag column, glyphs instead of icons */
  .look-terminal .row > * { grid-row: 1; }
  .look-terminal .c-st { grid-column: 1; }
  .look-terminal .c-date { grid-column: 2; text-align: left; font-size: 12px; }
  .look-terminal .c-from { grid-column: 3; gap: 1ch; }
  .look-terminal .c-subj { grid-column: 4; }
  .look-terminal .c-meta { grid-column: 5; }
  .look-terminal .task .c-title { grid-column: 3 / 5; }
  .look-terminal .task .c-date.late::before { content: "!"; }
  .look-terminal .c-st i, .look-terminal .c-st i.s1[data-g] { display: block; width: 1ch; height: auto; background: none; border-radius: 0; text-align: center; font: inherit; color: inherit; mask: none; }
  .look-terminal .c-st i[data-g="r"], .look-terminal .c-st i[data-g="f"] { color: var(--fg3); }
  .look-terminal .c-st i::before, .look-terminal .c-st i.s1[data-g="D"]::before { content: attr(data-g); }
  .look-terminal .c-st i[data-g="N"] { color: var(--accent); font-weight: 700; }
  .look-terminal .c-st i[data-g="!"], .look-terminal .c-st i[data-g="M"] { color: var(--warn); }
  .look-terminal .c-st i.s1[data-g="D"] { color: var(--danger); }
  .look-terminal .c-from .ad { font-size: inherit; }
  .look-terminal .c-from .ad:not(.only)::before { content: "<"; }
  .look-terminal .c-from .ad:not(.only)::after { content: ">"; }
  .look-terminal .spw { margin: 0; font-weight: 700; }
  .look-terminal .spw::before { content: "≠"; }
  .look-terminal .c-subj .snip { margin-left: 2ch; }
  .look-terminal .row.unread .c-subj .s { font-weight: 600; }
  .look-terminal .thr { box-shadow: none; padding: 0; margin-left: 1ch; font-size: 12px; }
  .look-terminal .tree { margin: 0 1ch 0 calc(var(--d) * 2ch); font-size: inherit; }
  .look-terminal .hl, .look-terminal .stg { background: none; padding: 0; font-size: 12px; }
  .look-terminal .mtask { color: var(--accent); }
  .look-terminal .mbell::before { content: "◔"; }
  .look-terminal .mmail::before { content: "✉"; }
  .look-terminal .chk, .look-terminal .chk.on { width: auto; height: auto; box-shadow: none; background: none; border-radius: 0; display: inline; }
  .look-terminal .chk::before { content: "[ ]"; }
  .look-terminal .chk.on::before { content: "[x]"; color: var(--ok); }
  .look-terminal .chk.on::after { content: none; }
  .look-terminal .sec { grid-template-columns: 1fr; font-weight: 400; font-size: 12px; }
  .look-terminal .sec > span:first-child { display: none; }
  .look-terminal .sec .sec-t { grid-column: 1; gap: 1ch; }
  .look-terminal .sec .sec-t::before { content: "──"; }
  .look-terminal .sec .n { font-size: inherit; }
  .look-terminal .sec .sec-t .acc { background: none; padding: 0; gap: 1ch; order: 2; margin-left: 1ch; }
  .look-terminal .sec .sec-t .acc span { padding: 0; height: auto; font: inherit; }
  .look-terminal .sec .sec-t .acc span.on { background: none; color: var(--accent); }
  .look-terminal .sec .sec-t .acc span.on::before { content: "["; }
  .look-terminal .sec .sec-t .acc span.on::after { content: "]"; }
  .look-terminal .acc.thsw .ic { display: none; }
  .look-terminal .acc.thsw .tw { display: inline; }
  .look-terminal .acc.tagsw .ic { display: none; }
  .look-terminal .acc.tagsw .tw { display: inline; }
  .look-terminal .acc.thsw + .acc { margin-left: 2ch; }
  .look-terminal .tb .acc.thsw { background: none; padding: 0; gap: 1ch; }
  .look-terminal .tb .acc.thsw span { height: auto; padding: 0; }
  .look-terminal .tb .acc.thsw span.on { background: none; color: var(--accent); }
  .look-terminal .tb .acc.thsw span.on::before { content: "["; }
  .look-terminal .tb .acc.thsw span.on::after { content: "]"; }
  .look-terminal .sec .n::before { content: "("; }
  .look-terminal .sec .n::after { content: ")"; }
  .look-terminal .sec .sec-t::after { content: ""; flex: 1; height: 1px; background: var(--line); align-self: center; }

  /* Reader and detail: Key value lines instead of chips */
  .look-terminal .rd, .look-terminal .td { padding-top: 16px; padding-bottom: 16px; }
  .look-terminal .rd { padding-left: var(--row-pad-l); }
  .look-terminal .hdrs, .look-terminal .props { display: grid; grid-template-columns: 9ch 1fr; grid-template-areas: none; row-gap: 1px; color: var(--fg2); }
  .look-terminal .props { padding-left: var(--text-x); }
  .look-terminal .hdrs > div, .look-terminal .props .p, .look-terminal .h-att { display: contents; }
  .look-terminal [data-k]::before { content: attr(data-k); color: var(--fg3); font-weight: 400; font-size: 12px; }
  .look-terminal .h-from::before, .look-terminal .h-from > * { order: 1; }
  .look-terminal .h-to::before, .look-terminal .h-to > * { order: 2; }
  .look-terminal .h-date::before, .look-terminal .h-date > * { order: 3; }
  .look-terminal .h-subj::before, .look-terminal .h-subj > * { order: 4; }
  .look-terminal .h-att > *::before, .look-terminal .h-att > * > * { order: 5; }
  .look-terminal .h-subj > * { color: var(--fg); font-weight: 700; font-size: 12px; }
  .look-terminal .h-from > * { color: var(--fg); }
  .look-terminal .h-from .addr { margin-left: 0; }
  .look-terminal .h-from .addr::before { content: " <"; }
  .look-terminal .h-from .addr::after { content: ">"; }
  .look-terminal .h-date > *, .look-terminal .h-to > * { font: inherit; color: var(--fg2); }
  .look-terminal .h-att .chip { display: contents; }
  .look-terminal .h-att .chip > span { color: var(--fg2); }
  .look-terminal .h-att .chip.acc > span { color: var(--accent); }
  .look-terminal .h-att .chip.acc > span::before { content: "[ ] "; }
  .look-terminal .props .p > .pk { display: none; }
  .look-terminal .props .p.warn .pv { color: var(--warn); font-weight: 400; }
  .look-terminal .rd-body { font-size: 12px; line-height: 1.65; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .look-terminal .td-title { margin-bottom: 8px; }
  .look-terminal .td-title h2 { font-size: 12px; font-weight: 700; }
  .look-terminal .td-notes { font-size: 12px; }
  .look-terminal .td-h { font-weight: 400; font-size: 12px; margin-top: 16px; }
  .look-terminal .td-h::before { content: "──"; }
  .look-terminal .td-h .n { font-size: inherit; }
  .look-terminal .step { height: 22px; gap: 1ch; }
  .look-terminal .td-link { height: 22px; }
  .look-terminal .td-link .lk.mail::before { content: "✉"; }
  .look-terminal .td-link .lk.file::before { content: "+"; }
  .look-terminal .td-link .rs.ok::before { content: "↩"; }
  .look-terminal .td-log li { padding: 1px 0; }
  .look-terminal .td-log time { font-size: 12px; }
  .look-terminal .empty h3 { font-size: 12px; color: var(--fg2); font-weight: 400; }
  .look-terminal .empty h3::before { content: "── "; }
  .look-terminal .empty h3::after { content: " ──"; }

  /* Search and filter */
  .look-terminal .day { height: 26px; padding: 6px var(--row-pad-r) 0 var(--row-pad-l); align-items: center; gap: 1ch; font-size: 12px; }
  .look-terminal .day::before { content: "──"; color: var(--fg3); }
  .look-terminal .day b, .look-terminal .day b.mon { font-size: 12px; line-height: inherit; letter-spacing: 0; min-width: 0; color: var(--accent); }
  .look-terminal .day b.dic { display: none; }
  .look-terminal .day .dl { border: 0; padding: 0; font-size: 12px; font-weight: 400; line-height: inherit; gap: 1ch; }
  .look-terminal .day .dl::after { content: ""; flex: 1; height: 1px; background: var(--line); align-self: center; order: 1; }
  .look-terminal .day .dl .n { margin: 0; order: 0; font-size: inherit; }
  .look-terminal .day .dl .n::before { content: "("; }
  .look-terminal .day .dl .n::after { content: ")"; }
  .look-terminal .tb .qchip { background: none; box-shadow: none; padding: 0; color: var(--accent); }
  .look-terminal .tb .qchip::before { content: "/"; }
  .look-terminal .tokn { border-radius: 0; background: none; padding: 0; height: auto; }
  .look-terminal .tokn .k::after { content: ":"; }
  .look-terminal .tokn .k { opacity: 1; font-size: inherit; }
  .look-terminal .tb .scope::before { content: "in "; color: var(--fg3); }
  .look-terminal .fbar { margin: 0 0 4px; border-radius: 0; box-shadow: none; background: var(--accent-soft); height: 24px; padding: 0 var(--row-pad-r) 0 var(--row-pad-l); }
  .look-terminal .fbar .fk { color: var(--accent); }
  .look-terminal .fbar .fk::after { content: " |"; }
  .look-terminal .fbar .q .caret { width: 1ch; height: 14px; }
  .look-terminal .sortbtn.on { background: none; }
  .look-terminal .sp { border-radius: 4px; font-size: 12px; }
  .look-terminal .sp-f { font-size: 13px; height: 38px; }
  .look-terminal .sp-f::before { content: "/"; color: var(--accent); font-weight: 700; }
  .look-terminal .sp-f .caret { width: 1ch; height: 16px; }
  .look-terminal .pill { border-radius: 0; box-shadow: none; padding: 0; height: auto; }
  .look-terminal .pill.on { background: none; color: var(--accent); }
  .look-terminal .pill.on::before { content: "["; }
  .look-terminal .pill.on::after { content: "]"; }
  .look-terminal .sp-scope { gap: 2ch; }
  .look-terminal .sp-i { height: 24px; border-radius: 2px; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1ch; }
  .look-terminal .sp-i.sub { padding-left: 4ch; }
  .look-terminal .sp-i.on .chk { box-shadow: none; }
  .look-terminal .sp-h { font-weight: 400; }
  .look-terminal .sp-h::before { content: "── "; }

  /* Chat: a log of lines, no avatars or bubbles */
  .look-terminal .av, .look-terminal .cc-f .ib { display: none; }
  .look-terminal .c-st i.s1[data-g="@"] { color: var(--accent); font-weight: 700; }
  .look-terminal .cv-h { padding-left: var(--text-x); }
  .look-terminal .cv-t, .look-terminal .cm-x, .look-terminal .cc-x { font-size: 12px; }
  .look-terminal .cm-h b { font-weight: 400; color: var(--accent); }
  .look-terminal .cm.me .cm-h b { color: var(--fg2); }
  .look-terminal .men { background: none; padding: 0; }
  .look-terminal .rx { border-radius: 0; box-shadow: none; padding: 0; height: auto; }
  .look-terminal .rx::before { content: "["; }
  .look-terminal .rx::after { content: "]"; }
  .look-terminal .cv-fold::before { content: "▸ "; }
  .look-terminal .cv-new { font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: lowercase; }
  .look-terminal .cv-new::before { content: "──"; }
  .look-terminal .cv-day { font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: lowercase; }
  .look-terminal .cv-day::before { content: "──"; }
  .look-terminal .cc { border-radius: 0; margin-left: var(--row-pad-l); box-shadow: inset 0 0 0 1px var(--line); }
  .look-terminal .cc.on { box-shadow: inset 0 0 0 1px var(--accent); }
  .look-terminal .cc-x::before { content: "› "; color: var(--accent); }
  .look-terminal .mpop { border-radius: 4px; font-size: 12px; }
  .look-terminal .mpop .ci { grid-template-columns: minmax(0, 1fr) auto; height: 22px; border-radius: 2px; }
  .look-terminal .sbi .pr { width: auto; margin-right: 1ch; }
  .look-terminal .td-link .lk.chat::before { content: "#"; }
  .look-terminal .crow { padding-top: 3px; padding-bottom: 4px; }
  .look-terminal .crow .c-date { grid-column: 3; text-align: right; }

  /* Today as one list: the kind as a glyph after the date */
  .look-terminal .list.mixed .col.m { --cols: var(--status-w) 8ch 2ch 16ch minmax(0, 1fr) auto; }
  .look-terminal .list.mixed .c-kind { grid-column: 3; }
  .look-terminal .list.mixed .c-from { grid-column: 4; }
  .look-terminal .list.mixed .c-subj { grid-column: 5; }
  .look-terminal .list.mixed .c-meta { grid-column: 6; }
  .look-terminal .list.mixed .col.m .sec .sec-t { grid-column: 1; }
  .look-terminal .c-kind.k-mail::before { content: "✉"; }
  .look-terminal .c-kind.k-chat::before { content: "#"; }
  .look-terminal .c-kind.k-book::before { content: "¶"; }

  /* Compose */
  .look-terminal .ct { font-size: 12px; }
  .look-terminal .btn, .look-terminal .tok { border-radius: 3px; font-size: 12px; }
  .look-terminal .fl { grid-template-columns: 9ch 1fr auto; min-height: 24px; }

  .look-terminal .fl .v.chk::before { content: none; }

  /* Templates: brackets instead of rings */
  .look-terminal .ph { border-radius: 0; box-shadow: none; background: none; padding: 0; }
  .look-terminal .ph.ok { color: var(--accent); background: none; }
  .look-terminal .ph.typing { background: var(--accent-soft); }
  .look-terminal .tp, .look-terminal .sheet { border-radius: 4px; font-size: 12px; }
  .look-terminal .tp-i { border-radius: 2px; padding: 3px 9px; grid-template-columns: minmax(0, 1fr) auto; }
  .look-terminal .tp-i .s { grid-column: 1 / -1; }
  .look-terminal .tp-i .n { box-shadow: none; padding: 0; }
  .look-terminal .tp-i .n::before { content: "["; }
  .look-terminal .tp-i .n::after { content: "]"; }
  .look-terminal .tp-h .t { font-size: 12px; font-weight: 700; }
  .look-terminal .tp-b { font-size: 12px; }
  .look-terminal .pf .in, .look-terminal .form .in { border-radius: 0; }
  .look-terminal .pf.cur .in, .look-terminal .form .in { box-shadow: inset 0 0 0 1px var(--accent); }
  .look-terminal .sheet-h .badge { display: none; }
  .look-terminal .sheet-h h3 { font-size: 12px; }
  .look-terminal .sheet-h h3::before { content: "── "; color: var(--warn); }
/* Merge Tasks: the same modal frame, a form inside. */
.tm-panel { width: 460px; }
.tm-b { padding: 4px 12px 2px; }
.tm-panel .tm-b .p { padding: 8px 0; }
.tm-l { margin: 9px 0 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.tm-opt { position: relative; padding: 4px 8px 4px 26px; border-radius: 5px; }
.tm-opt i { position: absolute; left: 8px; top: 50%; width: 10px; height: 10px; margin-top: -6px; border: 1px solid var(--fg3); border-radius: 50%; }
.tm-opt.on { background: var(--accent-soft, rgba(80,120,255,.18)); }
.tm-opt.on i { border-color: var(--accent); background: radial-gradient(var(--accent) 45%, transparent 50%); }
.tm-in { padding: 5px 8px; border: 1px solid rgba(127,127,127,.3); border-radius: 5px; background: var(--bg); }
.tm-in.on { border-color: var(--accent); }
