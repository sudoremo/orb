.tm-in .caret { display: inline-block; width: 1.5px; height: 14px; background: var(--accent); vertical-align: -2px; margin-left: 1px; }
.tm-notes { min-height: 84px; font-family: var(--mono); font-size: 11.5px; }
.tm-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tm-f { display: flex; align-items: center; gap: 8px; opacity: 1; }
.tm-f span { flex: 1; opacity: .6; }
.tm-f button { padding: 2px 10px; border: 1px solid rgba(127,127,127,.3); border-radius: 5px; background: transparent; color: inherit; font: inherit; }
.tm-f button.prim { border-color: var(--accent); background: var(--accent); color: #fff; }
/* Set Up iPhone: a modal over the window, the picker's frame around the code. */
.is-ov { align-items: center; padding-top: 0; }
.is-panel { width: 380px; border-radius: 12px; background: var(--menu-bg); font-size: 12.5px; overflow: hidden;
  -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: 0 24px 60px rgba(0,0,0,.4), 0 0 0 .5px var(--frame); }
.is-panel .h { padding: 10px 12px; font-weight: 600; border-bottom: 1px solid rgba(127, 127, 127, .2); }
.is-panel .p { padding: 8px 12px; opacity: .75; }

/* The states of the page controls, by the area of the app they show. */
const GROUPS = [
  ['Today', [['today', 'Stacked'], ['today-reading', '+ Reading'], ['today-chat', '+ Chat'], ['today-mixed', 'Mixed'], ['today-mixed-chat', 'Mixed: chat'], ['filter', 'Filter'], ['empty', 'Empty']]],
  ['Mail', [['inbox', 'Inbox'], ['reading', 'Reading'], ['threads', 'Threads'], ['conversation', 'Conversation'], ['suspect', 'Suspect mail'], ['outbox', 'Outbox'], ['max', 'Maximized'], ['command', 'Command'], ['palette', 'Palette'], ['item', 'Message window'], ['compose', 'Compose'], ['compose-drag', 'Compose: drag']]],
  ['Search', [['search-typing', 'Field'], ['search', 'Results'], ['search-tasks', 'Tasks'], ['search-scope', 'Scope']]],
  ['Tasks', [['task', 'Task'], ['upcoming', 'Upcoming'], ['by-tag', 'By tag'], ['due-first', 'Due first'], ['tasks', 'Tasks window'], ['tasks-narrow', 'Narrow'], ['merge', 'Merge'], ['iphone-setup', 'Set up iPhone']]],
  ['Chat', [['chat', 'Waiting'], ['chat-reply', 'Reply'], ['chat-room', 'Room'], ['chat-window', 'Window'], ['chat-signin', 'Sign-in']]],
  ['Templates', [['tpl-pick', 'Picker'], ['tpl-fill', 'Fill in'], ['tpl-send', 'Send check'], ['tpl-save', 'Save as template']]],
];
const LOOKS = ['hybrid', 'terminal'];
const LAST = {};
const STATES = GROUPS.flatMap(([, views]) => views.map(([v]) => v));
const S = { look: 'hybrid', s: 'inbox', t: 'dark', by: 'date', desc: true, threads: false, menu: false, view: false, cols: false, hints: false, pinKeys: false, people: false, help: false };
(() => {
  const [look, s, t, lay] = location.hash.slice(1).split('/');
  S.cols = lay === 'cols';
  if (LOOKS.includes(look)) S.look = look;
  if (STATES.includes(s)) S.s = s;
  if (['dark', 'light'].includes(t)) S.t = t;
})();
/* The overlay states draw the field over the state it was opened from. */
const BASE = { palette: 'inbox', 'search-typing': 'today', 'search-scope': 'inbox', 'iphone-setup': 'today', merge: 'today' };
const tpl = () => S.s.startsWith('tpl-');
const cur = () => BASE[S.s] || S.s;
const threaded = () => S.s === 'threads' || S.s === 'conversation' || (S.threads && ['inbox', 'command'].includes(S.s));
const split = () => S.cols && ['today', 'today-reading', 'today-chat', 'task'].includes(S.s);
/* Today as one list, in either of its states. */
const mixed = () => cur().startsWith('today-mixed');
/* A chat state of the main window; the chat window is a window of its own. */
const chat = () => S.s.startsWith('chat') && S.s !== 'chat-window';

/* ---------- Sidebar ---------- */
function item(icon, label, { n = '', staged = '', on = false, cls = '', d = 0, fold = '', data = false, lead = '' } = {}) {
  return `<div class="sbi ${cls}${on ? ' on' : ''}" style="--d:${d}">${lead || ic(icon)}<span class="sbi-l">${data ? label : lbl(label)}</span>`
    + `<span class="sbi-n">${staged ? `<span class="staged">${staged}</span>` : ''}${n}</span>`
    + `${fold ? `<span class="fold ${fold}">${ic('chev')}</span>` : ''}</div>`;
}
function grp(label, { n = '', collapsed = false, data = false } = {}) {
  return `<div class="sbg${collapsed ? ' collapsed' : ''}">${ic('chev')}${data ? label : lbl(label)}${n ? `<span class="sbi-n">${n}</span>` : ''}</div>`;
}
const unread = (n) => `<span class="unread">${n}</span>`;

function sidebar() {
  const c = cur();
  const on = c === 'upcoming' ? 'upcoming' : c === 'outbox' ? 'outbox' : ['inbox', 'threads', 'conversation', 'suspect', 'command'].includes(c) ? 'inbox' : c === 'reading' ? 'reading' : c.startsWith('search') ? '' : chat() ? c : 'today';
  const empty = S.s === 'empty';
  // In the chat states Archive and Projects are folded, to make room for the channels.
  const fold = chat() ? ' ' : 'open';
  const open = fold === 'open';
  return `<div class="lights"><i></i><i></i><i></i></div><button class="sbt" title="Hide the sidebar (zs)">${ic('sidebar')}</button>
    ${pins(on, empty)}
    ${S.s === 'outbox' ? item('outbox', 'Outbox', { n: `<span class="failed" title="1 message not sent">${ic('alert')}1</span>`, on: true, cls: 'outbox' }) : ''}
    ${grp('Tasks', { n: S.s === 'task' ? '<span class="staged" title="1 change not yet on the server">1</span>' : '<span title="Every task change is on the server">saved</span>' })}
    ${item('cal', 'Upcoming', { n: '9', on: on === 'upcoming' })}
    ${item('cloud', 'Someday')}
    ${item('done', 'Completed')}
    ${item('trash', 'Trash')}
    ${grp('Reading')}
    ${item('book', 'To read', { n: unread(3), on: on === 'reading' })}
    ${item('flag', 'Must read')}
    ${item('archive', 'Archive')}
    ${grp('Personal', { data: true })}
    ${item('inbox', 'Inbox', { n: empty ? '' : unread(12), staged: empty ? '' : '2', on: on === 'inbox' })}
    ${item('draft', 'Drafts', { n: '1' })}
    ${item('send', 'Sent')}
    ${item('archive', 'Archive', { fold })}
    ${open ? item('folder', '2025', { d: 1, data: true }) + item('folder', 'Receipts', { d: 1, data: true }) : ''}
    ${item('junk', 'Junk', { n: '3' })}
    ${item('trash', 'Trash')}
    ${item('folder', 'Projects', { fold, data: true })}
    ${open ? item('folder', 'Orb', { n: '2', d: 1, fold: 'open', data: true }) + item('folder', 'Design', { d: 2, data: true }) : ''}
    ${grp('Work', { n: unread(4), collapsed: true, data: true })}
    ${chatSidebar(on)}`;
}

/* The top of the sidebar is what the config pins, in its order and under no heading, then what
   gp pinned (here a direct message, gone from Direct), which drag into another order among
   themselves; ⌃1 … ⌃9 open them. A pinned view leaves its section; a folder the config pins
   stays in its account too. */
function pins(on, empty) {
  const key = (n, icon) => (S.pinKeys ? `<span class="key">${n}</span>` : ic(icon));
  return item('sun', 'Today', { n: empty ? '' : unread(3), on: on === 'today', cls: 'today', lead: key(1, 'sun') })
    + item('inbox', 'Personal', { n: empty ? '' : unread(12), staged: empty ? '' : '2', data: true, lead: key(2, 'inbox') })
    + item('inbox', 'Work', { n: unread(4), data: true, lead: key(3, 'inbox') })
    + item('chat', 'Waiting', { n: S.s === 'chat-signin' ? '' : unread(6), on: ['chat', 'chat-reply', 'chat-signin'].includes(on), lead: key(4, 'chat') })
    + item('user', 'Lukas Meier', { lead: key(5, 'user') });
}

/* One group for the chat server, under the accounts: the rooms, folded until wanted. Waiting is pinned. */
function chatSidebar(on) {
  const signin = S.s === 'chat-signin';
  const room = on === 'chat-room';
  return `${grp('Chat')}
    ${item('user', 'Direct', { n: signin ? '' : unread(2), fold: ' ' })}
    ${item('hash', 'Channels', { n: signin ? '' : unread(3), fold: room ? 'open' : ' ' })}
    ${room ? CHANNELS.map(([name, n, muted], i) => item('hash', muted ? `${name}<span class="sbi-mute" title="${muted}">${ic('mute')}</span>` : name,
      { n: n ? (muted ? `${n}` : unread(n)) : '', d: 1, data: true, on: i === 0 })).join('') : ''}`;
}

/* ---------- Rows ---------- */
/* The address never truncates — it is what tells a sender from an impostor; the name gives way. */
function sender(m) {
  const [lp, dm] = m.addr.split('@');
  const ad = `<span class="ad${m.from ? '' : ' only'}${m.spoof ? ' spoof' : ''}"><span class="lp">${lp}</span><span class="dm">@${dm}</span></span>`;
  const warn = m.spoof ? `<span class="spw" title="The name is an address other than the sender’s">${ic('alert')}</span>` : '';
  return m.from ? `<span class="nm${m.spoof ? ' spoof' : ''}">${m.from}</span>${warn}${ad}` : ad;
}

/* The kind column of Today as one list: what the row is, where the status column cannot say it. */
const kindCell = (k) => k === undefined ? '' : `<span class="c-kind${k ? ` k-${k}` : ''}">${k ? ic(k) : ''}</span>`;

function mailRow(m, cursor, kind) {
  const s1 = m.staged === 'del' ? 'D' : m.staged === 'move' ? 'M' : m.unread ? 'N' : m.replied ? 'r' : m.fwd ? 'f' : '';
  const meta = [];
  if (m.folder) meta.push(`<span class="fld">${m.folder}</span>`);
  if (m.hl) meta.push(`<span class="hl">${m.hl}</span>`);
  if (m.staged === 'move') meta.push(`<span class="stg">→ Archive</span>`);
  if (m.task) meta.push(`<span class="mtask" title="1 open task">${ic('task')}<span class="only-t">task</span></span>`);
  if (m.att) meta.push(`<span class="only-h">${ic('clip')}</span>`);
  if (m.flag) meta.push(`<span class="only-h flag">${ic('flag')}</span>`);
  const caret = m.open === undefined ? '' : m.open ? ' ▾' : ' ▸';
  const thr = m.thr ? `<span class="thr">${m.thr}${caret}</span>` : '';
  const tree = m.depth ? `<span class="tree" style="--d:${m.depth - 1}">└</span>` : '';
  const cls = ['row', 'mail', m.unread && 'unread', m.staged, cursor && 'cursor'].filter(Boolean).join(' ');
  return `<div class="${cls}">
    <span class="c-st"><i class="s1" data-g="${s1}"></i><i data-g="${m.flag ? '!' : ''}"></i><i data-g="${m.att ? '+' : ''}"></i></span>
    ${kindCell(kind)}<span class="c-from">${sender(m)}</span>
    <span class="c-subj">${tree}<span class="s">${m.subj}</span>${thr}<span class="snip">${m.snip}</span></span>
    <span class="c-meta">${meta.join('')}</span>
    <span class="c-date">${m.date}</span>
  </div>`;
}

function taskRow(t, cursor, kind) {
  const meta = [];
  if (t.steps) {
    const [d, n] = t.steps;
    meta.push(`<span class="prog"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><circle class="arc" cx="8" cy="8" r="6" stroke-dasharray="${(37.7 * d / n).toFixed(1)} 40"/></svg><span class="tagtxt">${d}/${n}</span></span>`);
  }
  if (t.bell) meta.push(`<span class="mbell">${ic('bell')}${t.bell === true ? '' : `<span class="tagtxt">${t.bell}</span>`}</span>`);
  if (t.mail) meta.push(`<span class="mmail">${ic('mail')}</span>`);
  (t.tags || []).forEach((g) => meta.push(`<span class="tagtxt tg">#${g}</span>`));
  const cls = ['row', 'task', t.done && 'done', cursor && 'cursor'].filter(Boolean).join(' ');
  return `<div class="${cls}">
    <span class="c-st"><span class="chk${t.done ? ' on' : ''}"></span></span>
    ${kindCell(kind)}<span class="c-title">${t.working ? '<span class="wk"></span>' : ''}${t.title}</span>
    <span class="c-meta">${meta.join('')}</span>
    <span class="c-date ${t.dueCls || ''}">${t.due || ''}</span>
  </div>`;
}

/* Waiting rows carry @ for a mention, the unread dot for anything else new; the reply arrow marks a
   thread whose newest message is yours. */
function chatRow(c, cursor, kind) {
  const s1 = c.mention ? '@' : c.unread ? 'N' : c.replied ? 'r' : '';
  const meta = [];
  if (c.task) meta.push(`<span class="mtask" title="1 open task">${ic('task')}<span class="only-t">task</span></span>`);
  if (c.att) meta.push(`<span class="only-h">${ic('clip')}</span>`);
  const text = c.title ? `<span class="s">${c.title}</span>${c.n ? `<span class="thr">${c.n}</span>` : ''}<span class="snip">${c.snip}</span>`
    : `<span class="s">${c.snip}</span>`;
  const cls = ['row', 'chat', c.unread && 'unread', cursor && 'cursor'].filter(Boolean).join(' ');
  return `<div class="${cls}">
    <span class="c-st"><i class="s1" data-g="${s1}"></i><i data-g="${c.att ? '+' : ''}"></i></span>
    ${kindCell(kind)}<span class="c-from"><span class="nm">${c.who}</span></span>
    <span class="c-subj">${c.room ? `<span class="rm">${c.room}</span>` : ''}${text}</span>
    <span class="c-meta">${meta.join('')}</span>
    <span class="c-date">${c.date}</span>
  </div>`;
}

function chatRow2(c, cursor) {
  const s1 = c.mention ? '@' : c.unread ? 'N' : '';
  const cls = ['crow', c.unread && 'unread', cursor && 'cursor'].filter(Boolean).join(' ');
  return `<div class="${cls}">
    <span class="c-st"><i class="s1" data-g="${s1}"></i></span>
    <span class="c-who"><b>${c.who}</b> <span class="rm">${c.room}</span></span>
    <span class="c-date">${c.date}</span>
    <span class="c-prev">${c.title ? `<span class="s">${c.title}</span> — ` : ''}${c.snip}</span>
  </div>`;
}

const sec = (label, n, accounts = '', live = false) => `<div class="sec${live ? ' on' : ''}"><span></span><span class="sec-t">${lbl(label)}<span class="n">${n}</span>${accounts}</span></div>`;
/* Today's mail from every inbox or from one account's, chosen beside the label. */
/* Messages or conversations, as zt switches: an icon each, a word in the terminal look. */
const threadsSwitch = () => `<span class="acc thsw">${[['mail', 'messages', !threaded()], ['thread', 'threads', threaded()]]
  .map(([i, w, on]) => `<span class="${on ? 'on' : ''}" title="${w === 'threads' ? 'Conversations' : 'Messages'} (zt)">${ic(i)}<i class="tw">${w}</i></span>`).join('')}</span>`;
/* Group by tag, as zg switches, at the end of the Tasks label in Today, Upcoming and Someday. */
const tagSwitch = (on = false) => `<span class="acc tagsw"><span class="${on ? 'on' : ''}" title="${on ? 'Stop grouping by tag' : 'Group by tag'} (zg)">${ic('tag')}<i class="tw">by tag</i></span></span>`;
/* Due first, as zd switches, before the tag switch in Today's Tasks label, with how many are due by today. */
const dueSwitch = (on = false) => `<span class="acc duesw"><span class="${on ? 'on' : ''}" title="${on ? 'Stop listing the due tasks first' : 'List the due tasks first'} (zd)">${ic('alert')}<i class="tw">due</i><span class="dn">2</span></span></span>`;
const accounts = () => threadsSwitch() + `<span class="acc">${['All', 'Personal', 'Work'].map((a, i) => `<span class="${i ? '' : 'on'}">${i ? a : lbl(a)}</span>`).join('')}</span>`;

function dayHead(g) {
  const b = g.num ? `<b>${g.num}</b>` : g.mon ? `<b class="mon">${g.mon}</b>` : `<b class="dic${g.sunny ? ' sunny' : ''}${g.untagged ? ' untagged' : ''}${g.due ? ' due' : ''}">${ic(g.icon)}</b>`;
  return `<div class="day">${b}<span class="dl">${g.label ? lbl(g.label) : ''}${g.n ? `<span class="n">${g.n}</span>` : ''}${g.folded ? '<span class="fold">▸</span>' : ''}</span></div>`;
}
/* Today grouped by tag (todo-spec §30): a heading per tag in the registry's order, No tag last.
   Hosting costs carries two tags and is listed under both. */
const TAG_GROUPS = [
  { icon: 'tag', label: 'work', n: 2, tasks: [{ ...TASKS[0], cur: 1 }, { title: 'Hosting costs for Orb', tags: ['work', 'personal'], due: '2 Nov' }] },
  { icon: 'tag', label: 'personal', n: 2, tasks: [TASKS[1], { title: 'Hosting costs for Orb', tags: ['work', 'personal'], due: '2 Nov' }] },
  { icon: 'tag', untagged: 1, label: 'No tag', n: 2, tasks: [TASKS[2], TASKS[3]] },
];
const taskGroups = (cursor, groups = TASK_GROUPS) => groups.map((g) => dayHead(g) + g.tasks.map((t) => taskRow(t, cursor && t.cur)).join('')).join('');

function filterList() {
  const m = { ...MAIL[0], subj: '<mark>Q4</mark> roadmap — draft for review' };
  const t = { ...TASKS[0], title: 'Review <mark>Q4</mark> roadmap' };
  return `<div class="fbar">${ic('filter')}<span class="fk">${lbl('Filter')}</span><span class="q">q4<span class="caret"></span></span><span class="cnt">2 matches</span><kbd>esc</kbd></div>`
    + sec('Mail', '1 of 6', accounts(), true) + mailRow(m, true)
    + '<div class="gap"></div>' + sec('Tasks', '1 of 4') + taskRow(t, false);
}

/* Today as one list: the tasks keep a column of their own on the right, and the
   mail, the chat and the reading share the timeline on the left. Each item sits at its moment —
   when the mail came, when the thread's newest message was written, when the feed item arrived.
   What is still waiting from yesterday is today's too, so the timeline has no groups. */
const MIX = {
  tasks: [TASKS[0], TASKS[1], { ...TASKS[2], bell: true, due: '17:00', dueCls: 'soon' }, TASKS[3]],
  line: [
    ['chat', CHATS[0]], ['chat', CHATS[1]], ['mail', MAIL[0]], ['mail', MAIL[1]], ['mail', MAIL[2]], ['chat', CHATS[2]],
    ['mail', MAIL[3]], ['chat', CHATS[3]], ['mail', MAIL[4]], ['mail', MAIL[5]],
    ['book', { from: 'Morning Briefing', addr: 'briefing@news.example', subj: 'Der Morgen: Was heute wichtig ist', snip: 'Guten Morgen. Die wichtigsten Themen des Tages im Überblick.', date: '06:30', unread: 1 }],
    ['chat', CHATS[4]], ['mail', MAIL[6]], ['mail', MAIL[7]], ['mail', MAIL[9]], ['book', READING[1]],
  ],
};
function mixedList() {
  const at = S.s === 'today-mixed-chat' ? CHATS[1] : MAIL[0];
  const row = ([k, x]) => k === 'chat' ? chatRow(x, x === at, 'chat') : mailRow(x, x === at, k);
  const line = S.desc ? MIX.line : [...MIX.line].reverse();
  return `<div class="col m">${sec('Timeline', MIX.line.length, accounts(), true)}${line.map(row).join('')}</div>`
    + `<div class="col t">${sec('Tasks', MIX.tasks.length, dueSwitch() + tagSwitch())}${MIX.tasks.map((t) => taskRow(t, false)).join('')}</div>`;
}

function list() {
  const c = cur();
  if (mixed()) return mixedList();
  if (c === 'conversation') return CONVERSATIONS.map((m, i) => mailRow(m, i === 0)).join('');
  if (threaded()) return THREADED.map((m) => mailRow(m, m.cur)).join('');
  if (['inbox', 'command', 'max', 'outbox'].includes(c)) return MAIL.map((m, i) => mailRow(m, i === 0 && c !== 'outbox')).join('');
  if (c === 'suspect') return MAIL.map((m) => mailRow(m, !!m.spoof)).join('');
  if (c === 'reading') return READING.map((m, i) => mailRow(m, i === 0)).join('');
  if (c === 'search') return sec('Mail', 5, '', true) + RESULTS.map((m, i) => mailRow(m, i === 0)).join('')
    + '<div class="gap"></div>' + sec('Tasks', 9) + taskGroups(false);
  if (c === 'search-tasks') return taskGroups(true);
  if (c === 'upcoming') return taskGroups(true, UPCOMING_GROUPS);
  if (c === 'by-tag') return sec('Mail', 6, accounts()) + MAIL.slice(0, 3).map((m) => mailRow(m, false)).join('')
    + '<div class="gap"></div>' + sec('Tasks', 5, dueSwitch() + tagSwitch(true), true) + taskGroups(true, TAG_GROUPS);
  /* Due first (todo-spec §31): the tasks due by today under Due, the rest under Other, each in the manual order. */
  if (c === 'due-first') return sec('Mail', 6, accounts()) + MAIL.slice(0, 3).map((m) => mailRow(m, false)).join('')
    + '<div class="gap"></div>' + sec('Tasks', 4, dueSwitch(true) + tagSwitch(), true)
    + taskGroups(true, [
      { icon: 'alert', due: 1, label: 'Due', n: 2, tasks: [{ ...TASKS[1], cur: 1 }, TASKS[2]] },
      { icon: 'sun', label: 'Other', tasks: [TASKS[0], TASKS[3]] },
    ]);
  if (c === 'filter') return filterList();
  if (c === 'empty') return emptyView();
  if (c === 'chat-signin') return signinView();
  if (c === 'chat-room') return ROOM.map((r, i) => chatRow(r, i === 1)).join('');
  if (chat()) return CHATS.map((r, i) => chatRow(r, i === 1)).join('');
  const taskCursor = S.s === 'task';
  const readingCursor = S.s === 'today-reading';
  const chatCursor = S.s === 'today-chat';
  const mailCursor = !taskCursor && !readingCursor && !chatCursor;
  /* Today's reading section, below the tasks: here the must-read items, the cursor in it. */
  const reading = !readingCursor ? '' : '<div class="gap"></div>'
    + sec('Reading', 2, `<span class="acc"><span class="on">${lbl('Must read')}</span><span>${lbl('New')}</span></span>`, true)
    + READING.filter((m) => m.flag).map((m, i) => mailRow(m, i === 0)).join('');
  /* Chat in Today, a section of its own below the tasks, above the reading: the threads that wait, the cursor in it. */
  const waiting = !chatCursor ? '' : '<div class="gap"></div>'
    + sec('Chat', '3 <span class="n">waiting</span>', '', true)
    + CHATS.slice(0, 3).map((r, i) => chatRow(r, i === 1)).join('');
  if (split()) return `<div class="col m">${sec('Mail', 6, accounts(), mailCursor)}${MAIL.slice(0, 6).map((m, i) => mailRow(m, mailCursor && i === 0)).join('')}</div>`
    + `<div class="col t">${sec('Tasks', 3, dueSwitch() + tagSwitch(), taskCursor)}${TASKS.map((t, i) => taskRow(t, taskCursor && i === 0)).join('')}${waiting}${reading}</div>`;
  return sec('Mail', 6, accounts(), mailCursor)
    + MAIL.slice(0, readingCursor || chatCursor ? 3 : 6).map((m, i) => mailRow(m, mailCursor && i === 0)).join('')
    + '<div class="gap"></div>'
    + sec('Tasks', 3, dueSwitch() + tagSwitch(), taskCursor)
    + TASKS.map((t, i) => taskRow(t, taskCursor && i === 0)).join('')
    + waiting
    + reading;
}

function emptyView() {
  return `<div class="empty">${ic('sun', 'big')}
    <h3>${lbl('Nothing left for today')}</h3>
    <p>No task is due · Every inbox is empty</p>
    <div class="eh"><span><kbd>o</kbd>${lbl('New task')}</span><span><kbd>C</kbd>${lbl('Compose')}</span></div></div>`;
}

function signinView() {
  return `<div class="empty">${ic('chat', 'big')}
    <h3>${lbl('Sign in to chat.example.com')}</h3>
    <p>The server signs in through single sign-on · Orb opens its sign-in page in a window of its own</p>
    <div class="eh"><span><kbd>↩</kbd>${lbl('Sign in')}</span></div></div>`;
}

/* ---------- Reader ---------- */
const BODY = `<p>Hi Sam,</p>
<p>attached is the first draft of the Q4 roadmap. The biggest open question is whether we ship offline sync before the redesign or after it — I lean towards before, since the redesign touches every pane.</p>
<p>Could you look at sections 2 and 4 before Thursday's design review? Comments straight in the PDF are fine.</p>
<p>Thanks,<br>Sara</p>`;

/* `tools`: the message under the pointer, with its tools beside it, the configured reactions first. */
function cm(who, time, html, { cont = false, me = false, extra = '', tools = false } = {}) {
  const [i, c] = AV[who];
  const bar = tools ? `<span class="cm-tools">${['👍', '🙏', '🎉', '👌'].map((e) => `<span class="q">${e}</span>`).join('')}<i class="sep"></i><span title="Make a task of this message">${ic('task')}</span>${me
    ? `<span title="Edit">${ic('draft')}</span><span title="Delete">${ic('trash')}</span>` : ''}</span>` : '';
  const gutter = cont ? `<time class="cm-gt">${time}</time>` : `<span class="av" style="--avc:${c}">${i}</span>`;
  return `<div class="cm${cont ? ' cont' : ''}${me ? ' me' : ''}${tools ? ' hover' : ''}">${gutter}
    <div class="cm-b">${cont ? '' : `<div class="cm-h"><b>${who}</b><time>${time}</time></div>`}<div class="cm-x">${html}</div>${extra}${bar}</div></div>`;
}

  if (S.s === 'task' || S.s === 'search-tasks' || S.s === 'upcoming' || S.s === 'by-tag' || S.s === 'due-first') return taskDetail();
  if (S.s === 'suspect') return suspectReader();

/* A conversation in the reader: its messages oldest first, the unread one and the newest open,
   the read one between them a line; the keys are on the first unread, outlined. */
function conversationReader() {
  const card = (who, pv, at, { open = false, unread = false, focus = false, body = '', chips = '' } = {}) =>
    `<div class="card${open ? ' open' : ''}${unread ? ' unread' : ''}${focus ? ' focus' : ''}">
      <div class="card-head"><i class="card-dot"></i><span class="card-who">${who}</span><span class="card-pv">${pv}</span><span class="card-when">${at}</span></div>
      ${open ? `<div class="card-body">${chips ? `<div class="h-att">${chips}</div>` : ''}${body}</div>` : ''}</div>`;
  return `<div class="rd conv">
    <div class="hdrs conv-hdrs">
      <div class="h-subj" data-k="Subject"><span>Q4 roadmap — draft for review</span></div>
      <div class="conv-sub" data-k="Thread"><span>3 messages · <b>1 unread</b> · Sara Brunner, Lukas Meier</span></div>
      <div class="h-att"><span class="chip acc" data-k="Task">${ic('task')}<span>Review Q4 roadmap <span class="dim">due Fri</span></span></span></div>
    </div>
    <div class="conv-stack">
      ${card('Sara Brunner', 'to me · cc Lukas Meier', 'Mon 09:40', { open: true, body: '<p>Hi Sam, attached is the first draft of the Q4 roadmap. The biggest open question is whether we ship offline sync this quarter or next.</p>', chips: `<span class="chip">${ic('clip')}<span>roadmap-q4.pdf <span class="dim">284 KB</span></span></span>` })}
      ${card('Lukas Meier', 'Section 4 reads well. One thing on hiring: we assume two people by January.', '10:12')}
      ${card('Sara Brunner', 'to me · cc Lukas Meier', '12:04', { open: true, unread: true, focus: true, body: '<p>Good point — I will add a second scenario with one hire, and move the sync work after the release.</p><p>Sara</p>' })}
    </div></div>`;
}

/* The Outbox, a panel in the reader: what the server refused first, then what waits for it. */
function outboxReader() {
  const kv = (k, v, cls = '') => `<div class="ob-kv${cls ? ` ${cls}` : ''}"><span class="k">${lbl(k)}</span><span>${v}</span></div>`;
  const one = (failed, subject, why, from, to, at, body) => `<section class="ob${failed ? ' failed' : ''}">
      <h2>${subject}<button>${failed ? 'Retry' : 'Send now'}</button><button>Edit</button><button>Delete</button></h2>
      ${kv('Status', why, 'why')}${kv('From', from)}${kv('To', to)}${kv('Queued', at)}
      <pre>${body}</pre></section>`;
  return `<div class="rd"><div class="h-subj" data-k="Subject"><span>Outbox</span></div>
    <div class="ob-top">1 not sent · 1 waiting<button>Retry all</button></div>
    ${one(true, 'Vereinsausflug 2026', 'Not sent: 535 Incorrect authentication data', 'it@club.example <span class="dim">via Personal (Club)</span>', 'Lukas Meier', '2026-10-28 11:29', 'Hi Lukas,\n\nthe bus is booked for the 14th.')}

}

/* ---------- Chrome ---------- */
/* The button names the order in force; the menu holds the orders the config's `default_sort` has.
   A new field starts the way the app starts it: newest first for dates, A to Z for text. */
const SORTS = {
  date: ['Date', [['Newest first', true], ['Oldest first', false]]],
  from: ['Sender', [['A to Z', false], ['Z to A', true]]],
  subject: ['Subject', [['A to Z', false], ['Z to A', true]]],
};
function sortControl() {
  const [name, dirs] = SORTS[S.by];
  const label = threaded() ? lbl('Newest first') : `${lbl(name)} ${S.desc ? '↓' : '↑'}`;
  const ck = (on) => `<span class="ck">${on ? '✓' : ''}</span>`;
  const menu = !S.menu ? '' : `<div class="menu">
      <div class="mh">${lbl('Sort by')}</div>
      ${Object.entries(SORTS).map(([k, [n]]) => `<div class="mi" data-by="${k}">${ck(S.by === k)}${lbl(n)}</div>`).join('')}
      <hr>
      ${dirs.map(([n, desc]) => `<div class="mi" data-desc="${desc ? 1 : 0}">${ck(S.desc === desc)}${lbl(n)}</div>`).join('')}
      <hr>
      <div class="mi" data-threads="1">${ck(threaded())}${lbl('Show as conversations')}<kbd>zt</kbd></div>
    </div>`;
  return `<span class="sort${S.menu ? ' open' : ''}"><button class="sortbtn" data-sort>${ic('sortic')}${label}${ic('chev', 'chev')}</button>${menu}</span>`;
}

const searchBox = (label, key) => `<span class="search">${ic('search')}<span class="q">${lbl(label)}</span><kbd>${key}</kbd></span>`;
const TODAY = date('Tuesday, 20 October', 'Tue 20 Oct');

/* Filter beside search: F narrows what is on screen, / searches everything. */
const filterBtn = (on = false) => `<button class="sortbtn${on ? ' on' : ''}" title="Filter this list (F)">${ic('filter')}${lbl('Filter')}<kbd>F</kbd></button>`;

function resultsBar(type) {
  const tabs = TABS.map(([n, c]) => `<span class="${n === type ? 'on' : ''}">${lbl(n)} <span class="c">${c}</span></span>`).join('');
  const order = type === 'Tasks' ? 'By date' : 'Relevance';
  return `<span class="tb-t">${lbl('Search')}</span>
    <span class="qchip" title="Change the search (/)">${ic('search')}roadmap</span>
    <span class="scope" title="Where it searched">${lbl('Everywhere')}${ic('chev')}</span>
    <span class="tb-sp"></span>
    <span class="lay" title="Switch the results (gs)">${tabs}</span>
    <span class="sort"><button class="sortbtn">${ic('sortic')}${lbl(order)}${ic('chev', 'chev')}</button></span><kbd>esc</kbd>`;
}

/* One list has one order: the timeline, either way up. */
function mixedOrder() {
  const ck = (on) => `<span class="ck">${on ? '✓' : ''}</span>`;
  const menu = !S.menu ? '' : `<div class="menu">
      <div class="mh">${lbl('Order')}</div>
      ${[['Newest first', true], ['Oldest first', false]].map(([n, d]) => `<div class="mi" data-desc="${d ? 1 : 0}">${ck(S.desc === d)}${lbl(n)}</div>`).join('')}
    </div>`;
  return `<span class="sort${S.menu ? ' open' : ''}"><button class="sortbtn" data-sort>${ic('sortic')}${lbl(S.desc ? 'Newest first' : 'Oldest first')}${ic('chev', 'chev')}</button>${menu}</span>`;
}

function toolbar() {
  const c = cur();
  if (c === 'search') return resultsBar('All');
  if (c === 'search-tasks') return resultsBar('Tasks');
  if (c === 'upcoming') return `<span class="tb-t">${lbl('Upcoming')}</span><span class="tb-s">${lbl('Tasks')} · 9</span><span class="tb-sp"></span>
    ${filterBtn()}${searchBox('Search', '/')}`;
  if (c === 'reading') return `<span class="tb-t">${lbl('To read')}</span><span class="tb-s">Reading · Personal</span><span class="tb-sp"></span>
    ${sortControl()}${filterBtn()}${searchBox('Search', '/')}`;
  if (c === 'chat-room') return `<span class="tb-t">#orb-dev</span><span class="tb-s">${lbl('Chat')} · 14 ${lbl('members')}</span><span class="tb-sp"></span>
    ${filterBtn()}${searchBox('Search', '/')}`;
  if (chat()) return `<span class="tb-t">${lbl('Waiting')}</span><span class="tb-s">${c === 'chat-signin' ? lbl('Chat') : `${lbl('Chat')} · 6 ${lbl('threads')}`}</span><span class="tb-sp"></span>
    ${filterBtn()}${searchBox('Search', '/')}`;
  if (['inbox', 'threads', 'conversation', 'suspect', 'command', 'max', 'outbox'].includes(c)) return `<span class="tb-t">${lbl('Inbox')}</span><span class="tb-s">Personal</span><span class="tb-sp"></span>
    ${threadsSwitch()}${sortControl()}${filterBtn()}${searchBox('Search', '/')}`;
  /* What Today shows, and how: one menu for the four sections and the layout, open while its switches are flipped. */
  const lays = [['stacked', 'Stacked', !S.cols && !mixed()], ['columns', 'Columns', S.cols && !mixed()], ['mixed', 'Mixed', mixed()]];
  const on = (k) => c === `today-${k}` || mixed();
  const ck = (v) => `<span class="ck">${v ? '✓' : ''}</span>`;
  const shows = [['mail', 'Mail', true, ''], ['tasks', 'Tasks', true, ''], ['chat', 'Chat', on('chat'), 'zw'], ['reading', 'Reading', on('reading'), 'zr']];
  const viewMenu = !S.view ? '' : `<div class="menu">
      <div class="mh">${lbl('Show')}</div>
      ${shows.map(([k, n, v, key]) => `<div class="mi" data-show="${k}">${ck(v)}${lbl(n)}${key ? `<kbd>${key}</kbd>` : ''}</div>`).join('')}
      <hr>
      <div class="mh">${lbl('Layout')}</div>
      ${lays.map(([v, n, sel]) => `<div class="mi" data-lay="${v}">${ck(sel)}${lbl(n)}${sel ? '' : `<kbd>${v === 'mixed' ? 'zx' : 'zl'}</kbd>`}</div>`).join('')}
    </div>`;
  const view = c === 'empty' ? '' : `<span class="sort${S.view ? ' open' : ''}" title="What Today shows, and how"><button class="sortbtn" data-view>${ic(mixed() ? 'mixed' : S.cols ? 'cols' : 'rows')}${lbl('View')}${ic('chev', 'chev')}</button>${viewMenu}</span>`;
  if (mixed()) return `<span class="tb-t">${lbl('Today')}</span><span class="tb-s">${TODAY}</span><span class="tb-sp"></span>${view}${mixedOrder()}${filterBtn()}${searchBox('Search', '/')}`;
  return `<span class="tb-t">${lbl('Today')}</span><span class="tb-s">${TODAY}</span><span class="tb-sp"></span>${view}${filterBtn(c === 'filter')}${searchBox('Search', '/')}`;
}

function status() {
  const live = S.s === 'chat-signin' ? '<span class="warn">chat signed out</span>' : '<span class="dot"></span>chat live';
  const sync = S.s === 'chat-window' ? `<span class="seg2">${live}</span>`
    : `<span class="wkg">▶ Review Q4 roadmap</span><span class="seg2">${S.s.startsWith('chat') ? live : '<span class="dot"></span>synced 12:38'}</span>`;
  if (S.s === 'command') {
    return `<span class="mode">CMD</span><span class="cmd">:move<span class="caret"></span></span><span class="st-sp"></span>
      <span><kbd>Tab</kbd> ${lbl('complete')} · <kbd>↩</kbd> ${lbl('run')} · <kbd>esc</kbd> ${lbl('cancel')}</span>`;
  }
  const [mode, msg, pos, staged] = STATUS[S.s];
  return `<span class="mode">${mode}</span>${msg ? `<span class="st-msg">${msg}</span>` : ''}<span class="st-sp"></span>
    ${S.s === 'outbox' ? '<span class="fail">1 not sent</span><span class="warn">1 waiting to send</span>' : ''}${staged ? '<span class="warn">2 staged</span>' : ''}${pos ? `<span>${pos}</span>` : ''}${sync}`;
}

    `Für den bevorstehenden Workshop vom ${datum} bitten wir Dich, Folgendes vorzubereiten:`, '',
    '- Lies die Unterlagen [1] vorab durch.',
    '- Notiere Dir die Fragen, die Du mitbringen möchtest.',
    '- Halte Deine Ideen für die nächsten Schritte bereit.', '',
    'Viele Grüsse', 'Sam',
    `[1] ${ph('Webseite')}`, '',
    ...quote, ...sig,
  ];
  const lines = L.map((l) => Array.isArray(l) ? `<div class="ln ${l[1]}">${l[0]}</div>` : `<div class="ln">${l}</div>`).join('');
  const subj = save ? 'Der Workshop ist ausgebucht' : 'Re: Anmeldung zum Workshop';
  const to = save ? 'Mia Steiner' : 'Jonas Keller';
  const pf = (name, cls, value, from = '') => `<div class="pf ${cls}"><span class="lb">${cls === 'ok' ? ic('check') : ''}${name}${from ? ` <span class="from">· ${lbl(from)}</span>` : ''}</span><span class="in">${value}</span></div>`;
  const fill = s === 'tpl-fill' ? `<div class="fl fill"><span class="k">${lbl('Fill in')}</span>
      <span class="pfs">${pf('Vorname', 'ok', 'Jonas', 'from To')}${pf('Datum', 'cur', 'Donnerstag, 5. November, 14:00<span class="caret"></span>')}${pf('Webseite', 'todo', lbl('Not filled in'))}</span>
      <span class="r"><span class="left">${lbl('1 of 3 left')}</span><span class="keys"><span><kbd>⇥</kbd> ${lbl('next')}</span><span><kbd>↩</kbd> ${lbl('to the text')}</span></span></span></div>` : '';
  const check = s === 'tpl-fill' ? `${lbl('Not filled in yet:')} {Datum}, {Webseite}`
    : sending ? `${lbl('Not filled in:')} {Datum} ${lbl('(line 3)')}, {Webseite} ${lbl('(line 12)')}` : '';
  const sheet = sending ? `<div class="sheet-scrim"><div class="sheet">
      <div class="sheet-h"><span class="badge">${ic('braces')}</span><div><h3>${lbl('2 placeholders are not filled in')}</h3>
        <p>${lbl('Jonas Keller would get them as they stand, braces and all.')}</p></div></div>
      <div class="sheet-l">
        <div class="it on">${ph('Datum')}<span class="ctx">Für den bevorstehenden Workshop vom {Datum} bitten …</span><span class="ln">${lbl('line')} 3</span></div>
        <div class="it">${ph('Webseite')}<span class="ctx">[1] {Webseite}</span><span class="ln">${lbl('line')} 12</span></div>
      </div>
      <div class="sheet-f"><button class="btn quiet">${lbl('Send anyway')} <kbd>⌥⌘↩</kbd></button>
        <button class="btn">${lbl('Cancel')} <kbd>esc</kbd></button>
        <button class="btn pri">${lbl('Fill in')} <kbd>↩</kbd></button></div>
    </div></div>` : save ? `<div class="sheet-scrim"><div class="sheet">
      <div class="sheet-h"><span class="badge acc">${ic('save')}</span><div><h3>${lbl('Save as template')}</h3>
        <p>${lbl('The subject and the text, without the signature: the identity adds its own when the template is used.')}</p></div></div>
      <div class="form">
        <span class="k">${lbl('Name')}</span><span class="in">Absage interner Workshop<span class="caret"></span></span>
        <span class="path">~/.config/orb/templates/<b>absage-workshop</b>.yml</span>
        <span class="k">${lbl('Offered in')}</span><span><span class="seg"><span class="on">Work</span><span>${lbl('Every account')}</span></span></span>
        <span class="k">${lbl('Keep')}</span><span class="opts">
          <span class="opt"><span class="chk on"></span>${lbl('Subject')}</span>
          <span class="opt"><span class="chk"></span>${lbl('To and Cc')} <span class="fld">— Mia Steiner</span></span></span>
      </div>
      <div class="tip">${lbl('Placeholders found:')} ${ph('Vorname')} ${ph('Datum')} — ${lbl('a word in braces becomes one. To change the file later, ⌘E in the template picker opens it in Neovim.')}</div>
      <div class="sheet-f"><button class="btn">${lbl('Cancel')} <kbd>esc</kbd></button><button class="btn pri">${lbl('Save')} <kbd>↩</kbd></button></div>
    </div></div>` : '';
  const mode = s === 'tpl-fill' ? '-- NORMAL --' : '-- INSERT --';
  return `<div class="ctb"><div class="lights"><i></i><i></i><i></i></div>
      <span class="ct" style="min-width:0;overflow:hidden;text-overflow:ellipsis">${subj}</span><span class="tb-sp"></span>
      <span class="saved">${lbl('Saved')} 14:22</span>
      <button class="btn${save ? '' : ' tpl'}${picking ? ' on' : ''}">${ic('tpl')}<span>${save || picking ? lbl('Template') : 'Einladung zum internen Workshop'}</span>${picking ? ' <kbd>⌘T</kbd>' : ''}</button>
      <button class="btn">${ic('task')}${lbl('Follow up')}</button>
      <button class="btn">${ic('clip')}${lbl('Attach')}</button>
      <button class="btn">${ic('trash')}${lbl('Discard')}</button>
      <button class="btn pri">${lbl('Send')} <kbd>⌘↩</kbd></button></div>
    <div class="fields">
      <div class="fl"><span class="k">From</span><span class="v">Sam Taylor <span class="addr">sam@work.example</span>${ic('chev', 'chev')}</span><span class="r">Work</span></div>
      <div class="fl"><span class="k">To</span><span class="v"><span class="tok">${to}</span></span><span class="r">Cc · Bcc</span></div>
      <div class="fl"><span class="k">Subject</span><span class="v subj">${subj}</span></div>
      ${fill}
      ${check ? `<div class="fl"><span class="k">Check</span><span class="v chk">${ic('alert')}${check}</span></div>` : ''}
    </div>
    <div class="nv">${lines}<div class="nvs"><span class="mode">${mode}</span><span class="st-sp"></span><span>${s === 'tpl-fill' ? '3,37' : '3,51'}</span><span>Top</span></div></div>${sheet}${picking ? `<div class="sheet-scrim pick">${templatePicker()}</div>` : ''}`;
}

const STATE_NOTES = {
  palette: 'The command palette, ⇧⌘K (Go ▸ Command Palette…): every command by a few letters of its title, with its group and its key. One box with prefixes, as in VS Code: ⌘K or gf opens it on the places the sidebar can open, > the commands, # the tags, @ people from the address book, / mail and tasks found by the search. A command that cannot act on what the cursor is on stays listed, greyed out, and Enter on it says why. With nothing typed the commands used last come first. A command that needs a word — a folder name, a tag — asks for it in the same box.',
  merge: 'Merge Tasks (context menu ▸ Merge…, Tasks ▸ Merge Tasks…, or :merge-tasks) on two or more selected tasks. Keep says which task stays — the first selected unless another is picked, which then proposes its own title and notes. The title is the kept one\'s, the notes are all of them (the others\' titles included, so nothing is lost), the dates the earliest of each; any can be changed. Steps, tags, reminders, linked messages and files come along without asking; the other tasks go to the Trash, and ⌘Z takes the whole merge back. ⌘↩ merges, Esc cancels. On the iPhone the selection bar has Merge, which opens the same form as a sheet.',
  'iphone-setup': 'Set Up iPhone (Tasks ▸ Set Up iPhone…, or :set-up-iphone): the code Orb on the iPhone scans to set itself up — the tasks account, its folder, the date language and the Today settings, and the password, which the Mac obtains as any login does, through the password command. The code is as sensitive as the password and says so; it is shown only while this is open, works for five minutes — the iPhone refuses it after that — and is replaced by a new one while the dialog stays open. Escape or a click outside closes it.',
  'tpl-pick': 'Proposal: a template is a YAML file in ~/.config/orb/templates/ — name, subject, body, and optionally accounts (the accounts it is offered in; without it, every one). Orb reads the folder as it is, so a template written or changed in any editor is there the next time the picker opens, and the folder can live in git or be synced. A template is picked once the message is under way: C, r, R or f as always, then ⌘T or Template in the title bar. Typing filters by name and subject; the templates of the account written from come first, then those for every account, and switching From changes what is offered. The right side is the template as it will be inserted, with what Orb already knows filled in — {Vorname} from the To recipient — and where it goes. Enter inserts it at the cursor: in a reply or a forward above the quote, and the reply keeps its Re: subject; in a new message the template’s subject fills an empty Subject and never replaces one already written. Text already in the body stays where it is; in Neovim the insertion is one change, which u takes back. ⌘E opens the file in a tab of the compose window’s Neovim. A file that does not parse is listed greyed out with its error, rather than left out.',
  'tpl-fill': 'A word in single or double braces is a placeholder: {Vorname} or {{Vorname}}, {Datum}, {Webseite} — the word is its label. The compose window lists them in a Fill in line under the header, one field per placeholder, in the order they first appear, subject included. Typing into a field fills every place the placeholder stands, live, so the text in Neovim shows what goes out; Tab goes to the next field, Enter (or Tab past the last) hands the keyboard to Neovim at the first placeholder still open. Fields that Orb can fill are filled and marked so: {Vorname}, {FirstName}, {Prénom} or {Nome} with the first To recipient’s first name and {Name} with their whole name, once there is one — never silently: the field shows where the value came from and can be overwritten. In Neovim placeholders still open are amber, filled ones tinted in the accent (OrbPlaceholder and OrbPlaceholderFilled, linked to DiagnosticWarn and Visual). Once all are filled, handing the keyboard to the text folds the line away. A placeholder edited by hand in the body is left to the hand that edited it. The plain text field fills the same way; switching between it and Neovim closes the line, and the placeholders are still checked before sending.',
  'tpl-send': 'A placeholder still in braces when Send is pressed stops the send, as the other checks do — but here the safe answer is the default: Enter goes back to the first one, in its field, and Send anyway needs ⌥⌘Enter or a click. Each placeholder is listed with the line it stands in, so the reader sees which sentence would go out broken; ↑ / ↓ choose one, Enter goes to it. The Check line says the same while writing, without asking anything. Any other check that fires (an attachment mentioned but missing, a sender for another identity) is listed in the same sheet, so one send never asks twice. Only braces from the template count: a brace typed into the text by hand, or in the quote of a reply, is left alone. The check lasts as long as the window: a draft reopened from Drafts is not checked (proposal: keep the placeholders with the draft).',
  'tpl-save': 'Proposal: Save as template (:save-as-template, or the Template menu in the compose window when the message is not from one) writes the message on screen as a new file: the name becomes the file name, the account written from becomes accounts unless Every account is chosen, and the subject and recipients are kept if ticked. The signature stays out: the identity adds its own when the template is used. Braces already in the text become its placeholders; to make one, write a word in braces before saving. An existing file of the same name is never overwritten without asking.',
  today: 'The View menu in the toolbar holds what Today shows and how: Mail, Tasks, Chat and Reading, each switched on or off, and the layout — open while its switches are flipped, Esc or a click elsewhere closes it, and the last section shown cannot be put away. A section put away keeps its cursor, and j / k, Tab and Ctrl-h/j/k/l pass it by; with the mail put away, the first section shown takes its room. Two layouts, switched with zl or the menu and remembered per machine; the third, Mixed, is one timeline beside the tasks (Today mixed). With tasks.completed_first_in_today in the config, the tasks completed today are listed above the open ones rather than in their place in the order. Stacked: mail and tasks on one grid, mail first. Columns: mail on the left and tasks on the right. Both keep mail ahead of tasks, the way the work goes, from a mail to the task it becomes; the mail column takes three fifths of the width until the line between them is dragged (a double-click restores it), and rows lose the snippet and the address but keep a task’s tags — a spoofed sender keeps its warning mark and turns its name red, and the reader shows the address. j / k move within a column, Tab between them, and the reader follows the cursor in both layouts. The half with the keyboard has the accent edge, the focused background and its label in the accent; the other half, and any pane without the keyboard, keeps its cursor in a grey fill; the live cursor is filled with the accent, its text white. Maximized (zm), Today shows only the half with the keyboard, with the reader below it in a row of its own rather than over the list; Tab (or Ctrl-h / Ctrl-l in columns) switches halves, and Ctrl-j / Ctrl-k go between the list and the reader. Today opens on the first message. The Mail label switches between every inbox and one account’s (All / Personal / Work), remembered per machine. A task with steps shows its progress as a ring and a count; an overdue date carries a “!” as well as its colour.',
  'today-chat': 'Chat in Today, under the heading Chat, off until Chat in the View menu or zw turns it on, and remembered per machine: the threads that wait, in a section of its own below the tasks and above the reading, with a line above it to drag, a screenful at most with a link to the rest — and, while nothing waits, a line saying so, so the switch always shows that it did something. j / k run on from the last task into it and back; Tab goes mail, tasks, (reading,) chat. In it the chat keys hold (r replies, a is done, gx opens it in Rocket.Chat) and the reader shows the conversation with its composer; keys that act on mail are refused rather than reaching the mail list. The cursor is in it here, so it has the accent edge.',
  'today-mixed': 'Mixed, the third layout beside Stacked and Columns — in the View menu, or zx, which toggles it and returns to the layout it left; remembered per machine. The tasks keep their column on the right, as in Columns, in their own order. On the left, the mail, and the chat and reading when their switches are on, are one timeline: each item at its moment — when the mail was sent, when the thread’s newest message was written, when the feed item was published — and the kind column names what it is. There are no groups: what still waits from yesterday is today’s too. Newest first or oldest first (the order button) turns the timeline over; a threaded list is newest first only. j / k run through the timeline, Tab and Ctrl-h / Ctrl-l go to the tasks and back. The keys are those of the row under the cursor — a archives mail and reading and is done for a thread, t makes a task of either — and the status line names its kind beside the position. The reader follows: a message, a conversation. Rows of several kinds can be selected together; a then archives the mail and the reading and is done for the threads. The filter narrows the timeline and the tasks alike, and is:mail, is:chat, is:reading and is:task narrow them to one kind.',
  'today-mixed-chat': 'The same timeline with the cursor on a thread: the reader is the conversation with its composer, the chat keys hold and the status line says so. Nothing in the list changes shape with the kind under the cursor, so j / k never jump; only the reader and the keys follow it. A thread that gets a new message moves up the timeline, and the cursor goes with it.',
  'today-reading': 'Reading in Today, off until Reading in the View menu or zr turns it on, and remembered per machine: the reading list below the tasks, in columns under them. A switch in its heading lists the must-read items or the new ones, a screenful at most, with a link to the rest. j / k run on from the last task (or thread) into it; Tab goes mail, tasks, chat, reading, and back. The keys act on the item under its cursor as on a message (a files it in the reading archive, ! takes it off must read) and the reader shows it. The cursor is in it here, so it has the accent edge.',
  reading: 'The reading list: newsletters set aside with b from any account, under a Reading heading of its own below the tasks rather than among the account’s folders. To read is the reading folder, its badge the unread items in it; Must read is the flagged ones; Archive is the archive folder. In the list the mail keys keep their meaning: ! marks an item must read, a files it in the reading archive and, in the archive, back; u marks it read. Every state is plain IMAP, so another machine or another client sees the same list. Feeds bring their items in as unread mail from the feed, the third row here: the body starts with a link to the article, which gx opens.',
  inbox: 'At the top of the sidebar, under no heading, what the config pins: Today, both inboxes and Waiting here, each opened by Ctrl and its number — holding Ctrl shows the keys over the pins. The fourth row is a spoofed sender: its name is an address other than the real one, so the real address turns red behind a warning mark. The status line offers U for the staged move: ⌘Z undoes only what was done at once.',
  max: 'zm maximizes (the user binds it to Ctrl-q): the list takes the whole window under the title strip and keeps its columns, and the reader is out over its right side as a drawer from the start, the keyboard staying in the list so j / k leaf through the mail in it. Ctrl-l or Enter gives it the keyboard, Esc or Ctrl-h hands the keyboard back, and q or Esc puts it away until the reader is given the keyboard again. The folders come out over the left side the same way while they have the keyboard. A message passed while the drawer is away is not marked read.',
  outbox: 'The Outbox, in the sidebar below the pins only while it holds anything: a message sent while its server could not be reached waits there and is tried again with every sync (an amber count); one the server then refused — a wrong password, a rejected recipient — stays as not sent, in red, with the server’s reason, and is announced with a notification. Nothing leaves it without the user. Opened from the sidebar, the status line or the notification, it is a panel in the reader, refused messages first: Retry puts one back in line and sends it now, Edit opens it in a compose window (it moves to Drafts with the first save), Delete asks, then deletes it unsent.',
  suspect: 'What the reader says against a message, on the spoofed one. Under the header: the receiving server’s verdict when the sender failed DMARC (or SPF with no passing DKIM), and a Reply-To outside the sender’s domain. A file that is dangerous to open — HTML, a macro document, a disk image, a Windows program, a name hiding its type — is red with a warning mark, and opening it asks first. In the HTML body, tracking pixels are gone even with remote images loaded, every link shows its real address on hover, and the link whose text names paypal.com while it opens paypa1-support.ru asks before opening, its tracking parameters stripped.',
  conversation: 'A collapsed thread’s row stands for the conversation: the subject of its first message, the sender and the opening words of its newest, unread while any message is, and the highlights and tasks of all of them. The reader shows every message, oldest first: the unread ones and the newest open, each with its own body, files and sender warnings; the others a line with their opening words, and three or more read ones above the first open one fold into a line of their own. Enter gives the reader the keyboard on the first unread message; there j / k move between the messages (outlined), Enter or za opens or closes one, zR / zM all of them, h goes back. Resting on the row reads all of it. a, d, s, u, ! and the rest act on every message of the conversation, in whatever folder each is; t makes one task, of the newest; r and f answer the newest, or the outlined one while the reader has the keyboard. za in the list opens the thread into rows of their own, to act on one message alone.',
  threads: 'The caret lives in the count badge after the subject, so subjects keep one edge. Replies indent one step each, with a tree mark; the head row carries the newest date and stays unread while any reply is.',
  'search-typing': 'Opened with / from Today — or from anywhere else — the field searches mail in every folder of every account, every task, or both: the switch at the end of the field (Mail / Tasks / All, ⌃T) says which, and the field opens on the last one chosen. Searching for tasks, the row of folders goes, since tasks are in none. What a word should match is offered as it is typed, so nobody has to know the operators: anywhere first, then the subject and the body, then people from the address book as sender or recipient, then task tags. ↑ / ↓ pick a line and Tab turns it into a chip; a typed operator (is:unread here) becomes the same chip, and Backspace at the start of the text turns the last chip back into text. The row under the field says where to search: everywhere, the open folder when there is one, one account, or Folders… to tick several. ⌃F steps through them. The bottom line lists the operators.',
  search: 'One result list for mail and tasks, laid out as Today is: the mail, then the tasks, stacked or in columns. The query and where it searched stay in the toolbar (click either to change it). All / Mail / Tasks (gs) narrow to one kind without searching again, each with its count. Every message names its folder, and the Mail results keep their order menu (relevance, date, sender, subject). Tab moves between the halves, n / N walk the matches, Esc leaves.',
  'by-tag': 'The tag button at the end of the Tasks label (zg, View ▸ Group Tasks by Tag) lists Today, Upcoming and Someday under their tags: a heading per tag in the registry\'s order, with its count, and No tag last. A task with several tags — Hosting costs here — is listed under each and counted once; completing it under one heading completes it under all, and ⌘↑ / ⌘↓ or a drag move it within its heading. In Upcoming the tags take the place of the dates. The button is pressed while it is on; the choice holds for the three views and is remembered per machine. A due date that is today is red, as an overdue one is; only the overdue carries the “!”.',
  'due-first': 'Before the tag button in Today\'s Tasks label (zd, View ▸ List Due Tasks First) sits the number of open tasks due today or earlier, in red — on or off, in every layout, and gone at none. Pressed, it lists them under Due, with their number, and the rest under Other; grouped by tag, within each tag, set apart by a line. Completed first still puts the completed tasks on top. Each band keeps the one manual order: ⌘↑ / ⌘↓ or a drag move a task within its band. Remembered per machine.',
  upcoming: 'Every open task with a date, as a plan read by date: Today first, with the overdue in red and today\'s, then one heading per day for the six days after, then one per month for the coming year, then one per year. Within a heading the earlier date comes first, then the global order. The undated are in Someday.',
  'search-tasks': 'The tasks found, grouped by postpone date as Things does it. Today comes first: everything postponed to today or earlier, overdue ones with their date in red. Then one heading per day for the coming week, the date big and the day beside it; then one per month; then Someday for the undated; then Completed, folded (za opens it). The date on the right stays the due date. A search finds tasks in every view — Upcoming, Someday, Completed — where the filter only narrows the view on screen.',
  'search-scope': 'Searching chosen folders, opened from the Inbox. This folder is one ⌃F away from wherever the search started, so searching the open folder needs no picker. Folders… lists every folder by account; space ticks one, and a subfolder is ticked on its own. Each folder ticked becomes an in: chip in the field, so where the search looks is visible, can be edited as text and is kept by a saved search. A search narrowed to folders finds mail only, since tasks live in no folder.',
  filter: 'The filter narrows the list on screen and nothing else: no other folder or view comes in, and the mode stays. F opens a bar at the top of the list, and the list follows each key. In Today it narrows both halves, and each section says how many of its rows are left. Plain words match what a row shows (sender, subject, a task’s title and tags); the search operators work too (f:, is:unread, tag:work). Enter gives the list the keyboard and keeps the filter; Esc clears it, and so does leaving the view. / is always the search, in the Tasks window too.',
  command: 'The command line takes over the status line, with completions just above it saying what each command takes, what it does and its key, so : also teaches the bindings. Tab fills in the next, Shift-Tab the one before.',
  task: 'Only what is set, as chips; one line names what can still be added. Steps (todo-spec §17) are a checklist with a title and a done state each, no dates of their own; the first open one is marked as next. + or Step opens a new step at the end to type into, as here: Enter keeps it and opens the next, Escape leaves; a double-click renames a step in place, and a right-click offers Rename, Mark as Done and Delete Step. d with steps selected removes them and x ticks them, both leaving the task alone; dragging a selected step moves the whole selection as one block. Each linked mail says whether you replied (green, with the time) or not (amber), since an unanswered one is usually why the task exists. Until an edit has reached the server the detail says so, and the Tasks heading counts the changes on their way; with none it says “saved”. A chat message links the same way (proposal): its room and its text, and whether you have written in its thread since.',
  empty: 'One sentence, one line of facts, the two keys that lead on. The reader pane is gone rather than left blank.',
  tasks: 'Proposal: a second window that shows tasks only — for a second screen, next to the mailbox — opened from the Window menu or a command of its own; each window remembers its frame. Its sidebar has the task views and the tags, its list groups Today into Overdue, Today and Done today, and the detail sits beside the list because the window has the width. / searches every task as in the main window; F filters the open view.',
  'tasks-narrow': 'The same Tasks window at half a screen’s width. Below about 900 px the detail moves under the list, and back beside it when the window is wider again — no setting to keep in step with the window.',
  item: 'A double-click on a message or a task opens it in a window of its own, beside the list it came from; double-clicking it again brings that window forward. The reader alone, under a toolbar that says where the message lives; every key of the reader works on it, and the window closes once the message is filed, deleted or moved. A task’s window is the same, with the task detail; it closes once the task is trashed.',
  chat: 'Proposal: Rocket.Chat as a third source beside mail and tasks, in a Chat group under the accounts. Waiting lists one row per thread that waits for you, newest first: any thread, in any room you are in, whose newest message is someone else’s — except in rooms the config sets to waiting: false. A direct message’s or a room’s timeline outside any thread counts as one thread. The row is a mail row: the newest author, the room, the thread’s first message as its title, the newest message as the snippet; @ marks a mention. A thread leaves Waiting once its newest message is yours, wherever you wrote it, or with a (done) or t; a new message from someone else brings it back, with its task mark. A task is made from one message, not from the conversation: t in the list takes the newest message, t in the conversation the message under the cursor, and that message carries the task as a chip. Reading a thread in Orb marks nothing read in Rocket.Chat; replying, done and a task mark it read there too, so the phone stops nagging. The reader is the conversation, oldest first and ending at the newest, earlier replies folded, a New line above what came since you last wrote. Today, the Inbox and the task views are unchanged.',
  'chat-reply': 'r gives the composer the keyboard. Enter sends, Shift-Enter starts a new line; @ completes people, : emoji, # rooms, Tab takes the choice. Files come from ⌘U, a paste or a drop, as chips above the text. “Also send to #orb-dev” is Rocket.Chat’s own switch for a thread reply that should show in the room too. Esc gives the keyboard back to the list and keeps the draft with the thread, on this Mac, until it is sent. ↑ in an empty composer edits your last message.',
  'chat-room': 'A room opened from the sidebar lists its threads in the same rows, newest activity first. The first row is the room itself — what was written outside any thread — and c writes there; r replies in the thread under the cursor. Threads you replied to last carry the reply arrow; threads that do not wait for you are not bold. Direct and Channels stay folded until wanted, with a count of what waits in them; a room the config sets to waiting: false is listed and counted but never waits, and one set to notify: false waits without a notification. A room muted with zq (here #support, until 17:00) carries a struck-out bell, and its count turns grey: its threads wait in the room alone, out of Waiting, Today and the notifications, until the mute ends or someone names you or calls the room with @here. Its threads are not counted in Channels.',
  'chat-window': 'Proposal: Window ▸ Chat Window (open-chat-window) opens chat on a screen of its own, the way the Tasks window does for tasks, and remembers its frame. Its sidebar is the chat group unfolded: Waiting, the people you write with and their presence, the channels. The list is narrow, so each row takes two lines, the preview on the second. The conversation has the height to show more of the thread. Both windows show the same Waiting: done in one is done in the other.',
  'chat-signin': 'Before the first sign-in, and when the server has ended the session. The server signs in through single sign-on (OAuth), which its REST API does not take directly, so Orb opens the server’s own sign-in page in a window, takes the session token it hands the web client, and keeps it in the Keychain. Mail and tasks are not affected; the status line says chat is signed out.',
  'compose-drag': 'A recipient dragged from To to Cc. Its place in To stays, faint, until it is let go; the copy under the pointer moves, and a bar shows where it lands, between two recipients of any line. Bcc shows while a drag lasts and stays only when something is dropped there. Esc, or letting go outside the lines, puts it back. ⌥↓/⌥↑ do the same from the keyboard for the selected recipient.',
  compose: 'One header block, Send with its key (⌘Enter, as today), the draft state in the title bar, and the switch to the plain text field beside Follow up (⌃T: a task for the message once it is sent), Attach, Discard (asks first) and Save & close (⇧⌘S). From lists every account’s identities on ⌘I or a click. A Check line under the header names what is worth a second look — the sender against the original and the recipients’ domains, an attachment mentioned but missing — and Send asks before sending past it. Bcc is a line of its own once asked for from the end of the Cc line, Files once something is attached. Neovim’s own status line is the only one in the window.',
};
const NOTES = {
  common: [
    'Both looks render the same markup; every difference between them is CSS (brackets and glyphs from ::before, Key value lines from data-k, lowercase from one class).',
    'Today stacked is one list on one grid: mail and tasks share the same left edge and columns, with a short section label and count instead of a second table header. In columns each half keeps that grid within itself.',
    'A key that starts longer bindings (g, z) shows what can follow it after a short pause, over the bottom right, for the table in force; typed on without a pause it never appears (k shows it here). gn picks people for a new chat one after another, as chips above the field (n shows it here).',
    '? lays every key over the window, wherever the keyboard is: it opens on Here, every key in force where it was pressed, with a tab per mode and one listing every command. Typing finds a key by what it does, or says what a key does; ↑ / ↓ choose, Enter runs the row, Tab moves between tabs, Esc closes (? shows it here).',
    'No column header row. The order in force sits in the toolbar as a small button (“Date ↓”), and its menu holds the sort field, the direction and the conversations toggle (m opens it here).',
    'The detail pane and the reader share the list’s left edges: the checkbox centres on the status column, text starts where list text starts.',
    'The status line is one line: the last action and how to take it back on the left, the steady state (staged, position, sync) on the right. A pane with more below fades out instead of ending on a row.',
    'The sidebar uses role names and role icons (Inbox, Junk, sun for Today), accounts collapse, and staged counts sit in an amber badge next to the unread count. Folders nest one step per level; headings do not indent what is under them.',
    'Proposal: debug details (revision, account) leave the task detail for a :task-info command.',
    'Every text colour meets 4.5:1 against its pane, in both looks and both themes.',
  ],
  hybrid: [
    'Keeps today’s split (list above the reader) with single-line 24 px rows, so roughly 14 rows above the reader and 30 without it.',
    'SF Pro for text, SF Mono for everything you scan in a column: dates, counts, keys, the status line.',
    'Cursor = 2 px accent bar plus a faint fill. Small, consistent badges: thread count, highlight label, staged move, task, file, flag.',
  ],
  terminal: [
    'Monospace throughout, aerc/mutt grammar: a flag column (N unread, ! flagged, + file, D/M staged), the date first, header lines as Key value.',
    'Vim-like modeline with a mode segment. Still a native window: vibrancy and traffic lights.',
    'The densest look: 24 px rows, about 14 rows above the reader.',

/* Merge Tasks over Today (todo-spec §29): which task stays, its title, notes and dates as proposed. */
/* The command palette on its commands, `arch` typed, Enter pressed on a command that cannot act on this message. */
function palette() {
  const row = (t, g, key, cls = '') => `<div class="cp-row ${cls}"><span class="t">${t}</span><span class="g">${g}</span>${key ? `<kbd>${key}</kbd>` : ''}</div>`;
  return `<div class="is-panel cp-panel">
    <div class="cp-sec" style="padding-top:8px">Commands</div>
    <div class="cp-in">&gt;arch<span class="caret"></span></div>
    ${row('<b>Arch</b>ive', 'Acting on mail', 'a', 'on off')}
    ${row('Reading <b>Arch</b>ive', 'Acting on mail', '')}
    ${row('<b>Arch</b>ived Tasks', 'Tasks', '')}
    <div class="f">Archive: it is in the archive already · ⌘K places · &gt; commands · # tags · @ people · / mail and tasks</div>
  </div>`;
}

function mergeDialog() {
  const opt = (t, on) => `<div class="tm-opt${on ? ' on' : ''}"><i></i>${t}</div>`;
  return `<div class="is-panel tm-panel">
    <div class="h">Merge 2 tasks</div>
    <div class="tm-b">
      <div class="tm-l">Keep</div>${opt('Review Q4 roadmap', 1)}${opt('Send the roadmap numbers to Lukas', 0)}
      <div class="tm-l">Title</div><div class="tm-in on">Review Q4 roadmap and send Lukas the numbers<span class="caret"></span></div>
      <div class="tm-l">Notes</div><div class="tm-in tm-notes">Focus on sync (section 2) and hiring (section 4).<br><br>Send the roadmap numbers to Lukas<br>He needs them before the board call.</div>
      <div class="tm-dates"><div><div class="tm-l">Postpone</div><div class="tm-in">Tue 20 Oct ▾</div></div><div><div class="tm-l">Due</div><div class="tm-in">Mon 19 Oct ▾</div></div></div>
      <div class="p">Comes along: 4 steps, 1 tag, 1 reminder, 2 linked messages, 1 file. The other task goes to the Trash; ⌘Z takes the merge back.</div>
    </div>
    <div class="f tm-f"><span>⌘↩ merge · esc cancel</span><button>Cancel</button><button class="prim">Merge</button></div>
  </div>`;
}

/* Set Up iPhone over Today: a stand-in for the code, which the core draws. */
function iphoneSetup() {
  let cells = '';
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const finder = (x < 7 || x > 17) && y < 7 || x < 7 && y > 17;
    const on = finder ? !(x % 6 && y % 6) || (x % 6 > 1 && x % 6 < 5 && y % 6 > 1 && y % 6 < 5 && (x < 7 ? x : x - 18) < 7) : (x * 7 + y * 13 + x * y) % 3 === 0;
    if (on) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<div class="is-panel">
    <div class="h">Set up iPhone</div>
    <div class="p">Scan this with Orb on the iPhone: “Scan the Code on Your Mac”. It sets up sam@work.example on imap.work.example, folder “Orb Tasks”.</div>
    <div class="qr"><svg viewBox="-2 -2 29 29" width="230" height="230" fill="#000">${cells}</svg></div>
    <div class="p warn">The code holds the password. Anyone who sees or photographs it can read this account’s mail. Close this once the iPhone is set up.</div>
    <div class="p">This code works for 4:37 more</div>
    <div class="f">esc  close</div>
  </div>`;
}

function render() {
  const w = document.getElementById('win');
  const tasks = ['tasks', 'tasks-narrow'].includes(S.s);
  w.className = ['win', `look-${S.look}`, S.t, S.s === 'max' && 'max', (S.s === 'compose' || S.s === 'compose-drag' || tpl()) && 'compose', tpl() && 'tall', tasks && 'tasks', S.s === 'tasks-narrow' && 'narrow', S.s === 'item' && 'item'].filter(Boolean).join(' ');
  document.body.className = S.t === 'light' ? 'page-light' : '';
  w.innerHTML = tpl() ? templateWin() : S.s === 'compose' || S.s === 'compose-drag' ? composeWin(S.s === 'compose-drag') : S.s === 'item' ? itemWin() : tasks ? tasksWin() : S.s === 'chat-window' ? chatWin() : mainWin();
  w.querySelectorAll('.list:not(.cols), .col, .reader').forEach((el) => el.classList.toggle('more', el.scrollHeight > el.clientHeight + 1));
  const [group, views] = GROUPS.find(([, vs]) => vs.some(([v]) => v === S.s));
  // An area opens on the state last shown in it.
  LAST[group] = S.s;
  document.getElementById('groups').innerHTML = GROUPS.map(([g, vs]) => `<button data-val="${LAST[g] || vs[0][0]}" class="${g === group ? 'on' : ''}">${g}</button>`).join('');
  document.getElementById('views').innerHTML = views.map(([v, l]) => `<button data-val="${v}" class="${v === S.s ? 'on' : ''}">${l}</button>`).join('');
  document.querySelectorAll('.seg[data-k]').forEach((g) =>
    g.querySelectorAll('button').forEach((b) => b.classList.toggle('on', S[g.dataset.k] === b.dataset.val)));
  const g = document.getElementById('guide');
  g.className = `guide ${S.t}`;
  g.innerHTML = guide();
  const ul = (items) => `<ul>${items.map((n) => `<li>${n}</li>`).join('')}</ul>`;
  document.getElementById('notes').innerHTML =
    `<div><h3>This state</h3>${ul([STATE_NOTES[S.s]])}<h3>Both looks</h3>${ul(NOTES.common)}</div>
     <div><h3>${S.look === 'hybrid' ? 'Hybrid' : 'Terminal'}</h3>${ul(NOTES[S.look])}</div>`;
  history.replaceState(null, '', `#${S.look}/${S.s}/${S.t}${S.cols ? '/cols' : ''}`);
}

document.getElementById('win').addEventListener('click', (e) => {
  const mi = e.target.closest('.mi');
  const lay = e.target.closest('[data-lay]');
  const show = e.target.closest('[data-show]');
  if (lay) {
    if (lay.dataset.lay === 'mixed') { if (!mixed()) S.s = 'today-mixed'; }
    else { S.cols = lay.dataset.lay === 'columns'; if (mixed()) S.s = 'today'; }
  }
  else if (show) {
    const k = show.dataset.show;
    if (k === 'chat' || k === 'reading') S.s = S.s === `today-${k}` ? 'today' : `today-${k}`;
  }
  else if (e.target.closest('[data-view]')) { S.view = !S.view; S.menu = false; }
  else if (e.target.closest('[data-sort]')) { S.menu = !S.menu; S.view = false; }
  else if (mi) {
    if (mi.dataset.by && mi.dataset.by !== S.by) { S.by = mi.dataset.by; S.desc = S.by === 'date'; }
    if (mi.dataset.desc) S.desc = mi.dataset.desc === '1';
    if (mi.dataset.threads) {
      const on = threaded();
      S.threads = !on;
      if (on && (S.s === 'threads' || S.s === 'conversation')) S.s = 'inbox';
    }
    S.menu = false;
  } else if (S.menu || S.view) S.menu = S.view = false;
  else return;
  render();
});
document.querySelectorAll('.seg').forEach((g) => g.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  S[g.dataset.k || 's'] = b.dataset.val; S.menu = S.view = false; render();
}));
document.addEventListener('keyup', (e) => {
  if (e.key === 'Control' && S.pinKeys) { S.pinKeys = false; render(); }
});
document.addEventListener('keydown', (e) => {
  if (S.pinKeys !== (e.key === 'Control')) { S.pinKeys = e.key === 'Control'; render(); }
  if (e.metaKey || e.ctrlKey) return;
  if (e.key === '1' || e.key === '2') S.look = LOOKS[+e.key - 1];
  else if (e.key === 's') S.s = STATES[(STATES.indexOf(S.s) + 1) % STATES.length];
  else if (e.key === 't') S.t = S.t === 'dark' ? 'light' : 'dark';
  else if (e.key === 'l') S.cols = !S.cols;
  else if (e.key === 'k') S.hints = !S.hints;
  else if (e.key === 'n') S.people = !S.people;
  else if (e.key === '?') S.help = !S.help;
  else if (e.key === 'm' && document.querySelector('.sortbtn')) { S.menu = !S.menu; render(); return; }
  else if (e.key === 'Escape' && S.menu) S.menu = false;
  else return;
  if (e.key !== 'Escape') S.menu = false;
  render();
});
render();
</script>
