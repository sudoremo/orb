name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions are pinned to a commit, with the tag as a comment;
# Dependabot (.github/dependabot.yml) moves both together.

permissions:
  contents: read

# A push to a pull request cancels the run of the one before it; on main
# every run finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # --all-targets also compiles every test binary (incl. the Docker-gated
      # imap/smtp integration tests), so API drift in them fails the build here.
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Run unit tests
        run: cargo test --lib

      - name: Run store integration tests
        run: cargo test --test store_integration

      # The Docker-gated tests in these suites are #[ignore]d, so only the pure
      # ones (message formatting, address validation) run here.
      - name: Run the pure IMAP and SMTP tests
        run: cargo test --test imap_integration --test smtp_integration

  # The suites that need a container runtime: Dovecot for IMAP and task sync,
  # MailHog for SMTP. testcontainers pulls the images and tears them down.
  docker:
    name: Docker-backed integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run the Docker-backed suites
        run: cargo test --test imap_integration --test smtp_integration --test task_sync_integration --test filter_integration --test feed_integration --test task_export_roundtrip -- --ignored

      # The sync under injected network faults: a dropped socket, a frozen one,
      # a connection dead after sleep, a server that says NO. Its own step so
      # the proxy's connections do not share a process with the other suites.
      - name: Run the sync fault tests
        run: cargo test --test sync_faults -- --ignored --test-threads=1

  app:
    name: App (Tauri)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      # app/src-tauri is a workspace of its own; its target dir is the
      # repository's (.cargo/config.toml).
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri -> ../../target

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Type-checks under `tsc --strict` and bundles.
      - name: Build frontend
        working-directory: app
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('app/pnpm-lock.yaml') }}

      # The harness against its stubbed backend: the list's highlight styles,
      # its roles, the cursor, and Today's tasks and inboxes.
      - name: Test the frontend in a browser
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium webkit && pnpm test

      # The error context and the trace of every test that failed or retried.
      - name: Keep the Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          path: app/test-results
          retention-days: 14

      - name: Check formatting
        working-directory: app/src-tauri
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: app/src-tauri
        run: cargo test

  # The iOS side: the core as iOS builds it, orb-mobile, OrbKit's tests on a
  # simulator and the app built. Not the app's UI tests: they share from
  # Safari and wait for notification banners, which a hosted simulator does
  # not deliver, so they stay local (scripts/test-ios.sh --ui).
  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run the iOS checks
        run: scripts/test-ios.sh

  # The one check branch protection needs: green only when every job is.
  ci-success:
    name: CI Success
    needs: [test, docker, app, ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE 'failure|cancelled|skipped' <<<"$RESULTS"; then
            echo "One or more jobs did not succeed"
            exit 1
          fi
          echo "All CI jobs passed!"
