[package]
name = "orb-mobile"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "orb_mobile"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
orb-core = { path = "../..", default-features = false, features = ["mobile", "uniffi"] }
secrecy = "0.10"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt", "net", "time"] }
uniffi = "0.32"

[dev-dependencies]
tempfile = "3.15"

[features]
# The bindings generator, run by scripts/build-xcframework.sh.
bindgen = ["uniffi/cli"]
