[workspace]
members = [".", "crates/orb-mobile"]

[package]
name = "orb-core"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sudoremo/orb"

[lib]
name = "orb_core"
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
# Core email/database dependencies
anyhow = "1.0.100"
async-imap = "0.11.1"
async-native-tls = "0.5.0"
chrono = "0.4"
mailparse = "0.16.1"
rusqlite = { version = "0.37.0", features = ["bundled", "functions"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shellexpand = "3.1.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["net", "rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] }
futures = "0.3"
hostname = "0.4"
# Checksums in a task export's manifest (todo-spec §20).
sha2 = "0.10"
rand = "0.8"
secrecy = "0.10"
uuid = { version = "1.11", features = ["v4"] }
regex = "1.11"
unicode-normalization = "0.1"
rfc2047-decoder = "1.0.6"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
shell-words = "1.1"
sqlite-vec = "0.1.9"
model2vec-rs = { version = "0.2.1", default-features = false, features = ["fancy-regex", "local-only"] }
html2text = "0.17.1"
# The `data:` URLs the HTML rendering shows inline images through.
base64 = "0.22"
# TCP keepalive on the IMAP sockets; tokio does not expose the option itself.
socket2 = "0.6"
# The embedded Neovim and the network watcher: desktop only (the `desktop`
# feature below).
nvim-rs = { version = "0.9", features = ["use_tokio"], optional = true }
async-trait = { version = "0.1", optional = true }
rmpv = { version = "1", optional = true }
if-watch = { version = "3.2", features = ["tokio"], optional = true }
# The setup code the Mac shows an iPhone (src/setup_code.rs).
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }
# The Rocket.Chat REST API and its realtime websocket, and the RSS, Atom and
# JSON feeds of the reading list, on the same native TLS as IMAP.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "multipart", "gzip"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
feed-rs = "3.0.0"
# The Swift bindings of `crates/orb-mobile`; see the `uniffi` feature.
uniffi = { version = "0.32", optional = true }

[target.'cfg(unix)'.dependencies]
# `kill(pid, 0)`, to tell a crashed instance's sync lock from a live one.
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"

[features]
default = ["desktop"]
# What starts another process or needs a desktop service: the embedded Neovim,
# password commands, `navigation.escalate_command`, the login shell's PATH, the
# config file watch and the network watcher. iOS builds without it.
desktop = ["dep:nvim-rs", "dep:async-trait", "dep:rmpv", "dep:if-watch", "dep:qrcode"]
# The iPhone and iPad. The platform reports network changes itself
# (`OrbHandle::network_changed`).
mobile = []
# UniFFI derives on the records `crates/orb-mobile` passes to Swift.
uniffi = ["dep:uniffi"]

[dev-dependencies]
tempfile = "3.15"
testcontainers = { version = "0.23", features = ["watchdog"] }
tokio-test = "0.4"

# The debug info goes into a .dSYM per binary rather than staying in rustc's
# object files: left unpacked, every rebuild of a test binary leaves 256 more
# of those behind and cargo never removes them — 50 GB in a week. The
# dependencies need none at all. Kept the same in app/src-tauri/Cargo.toml,
# so the two share their builds in the one target dir.
[profile.dev]
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
